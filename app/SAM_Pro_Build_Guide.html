<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAM Pro Build Guide</title>
<meta name="description" content="Offline, step-by-step guide to build ServiceNow Software Asset Management Professional on a Zurich sandbox.">
<style>
/* Layout: a fixed run-sheet rail on the left (stages like a work order), one reading column on the right.
   Step numbers are styled as printed asset tags; status always shows as a labelled pill. */
:root {
  --bg: #f3f5f4;
  --surface: #ffffff;
  --surface-2: #edf1ef;
  --ink: #16232a;
  --ink-2: #435359;
  --ink-3: #66767c;
  --line: #d3dcd8;
  --line-strong: #b9c6c1;
  --accent: #0a6b5c;
  --accent-hover: #08594c;
  --accent-ink: #ffffff;
  --accent-soft: #dff0ea;
  --good: #1b7543;
  --good-soft: #e1f2e7;
  --warn: #8f5500;
  --warn-soft: #faefdb;
  --bad: #ae2620;
  --bad-soft: #fae5e3;
  --info: #2c5786;
  --info-soft: #e6edf6;
  --tag-bg: #fbfcfb;
  --focus: #1b66d1;
  --shadow: 0 1px 2px rgba(22, 35, 42, .06), 0 4px 14px rgba(22, 35, 42, .05);
  --font-ui: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-display: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --radius: 10px;
  --rail: 292px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1416; --surface: #151f22; --surface-2: #1b282c; --ink: #e3ebe9; --ink-2: #b0bebc; --ink-3: #8b9b9c;
    --line: #2a393e; --line-strong: #3a4d53; --accent: #45bfa3; --accent-hover: #63d2b8; --accent-ink: #04211b; --accent-soft: #163a32;
    --good: #61cf8e; --good-soft: #15352a; --warn: #efb158; --warn-soft: #382a14; --bad: #ff8d83; --bad-soft: #3b1d1b;
    --info: #8fb7e9; --info-soft: #1a2a3b; --tag-bg: #11191b; --focus: #8ab4f8;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 6px 18px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1416; --surface: #151f22; --surface-2: #1b282c; --ink: #e3ebe9; --ink-2: #b0bebc; --ink-3: #8b9b9c;
  --line: #2a393e; --line-strong: #3a4d53; --accent: #45bfa3; --accent-hover: #63d2b8; --accent-ink: #04211b; --accent-soft: #163a32;
  --good: #61cf8e; --good-soft: #15352a; --warn: #efb158; --warn-soft: #382a14; --bad: #ff8d83; --bad-soft: #3b1d1b;
  --info: #8fb7e9; --info-soft: #1a2a3b; --tag-bg: #11191b; --focus: #8ab4f8;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 6px 18px rgba(0, 0, 0, .25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.55 var(--font-ui); -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
a { color: var(--accent); }
a:hover { color: var(--accent-hover); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
code, kbd, .mono { font-family: var(--font-mono); font-size: .88em; }
code { background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: .05em .35em; overflow-wrap: anywhere; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: 1.85rem; font-weight: 650; letter-spacing: -.01em; }
h2 { font-size: 1.3rem; font-weight: 640; }
h3 { font-size: 1.05rem; font-weight: 620; }
p { margin: 0; }
.muted { color: var(--ink-3); }
.small { font-size: .86rem; }
.eyebrow { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.tabular { font-variant-numeric: tabular-nums; }
.svg { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.125em; }

/* App frame */
.app { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 100%;
  background: linear-gradient(90deg, var(--surface) 0, var(--surface) calc(var(--rail) - 1px), var(--line) calc(var(--rail) - 1px), var(--line) var(--rail), var(--bg) var(--rail)); }
.rail {
  position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--surface);
  padding: 18px 14px 28px; display: flex; flex-direction: column; gap: 18px;
}
.brand { display: flex; flex-direction: column; gap: 10px; padding: 2px 6px 0; }
.brand-name { font-family: var(--font-display); font-weight: 680; font-size: 1.08rem; display: flex; align-items: center; gap: 8px; }
.brand-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 700 .72rem/1 var(--font-mono); letter-spacing: .02em; }
.brand-sub { font-size: .8rem; color: var(--ink-3); }
.nav-group { display: flex; flex-direction: column; gap: 2px; }
.nav-group > .eyebrow { padding: 0 8px 4px; }
.nav-link {
  display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 8px; text-decoration: none;
  color: var(--ink-2); font-size: .92rem; border: 1px solid transparent; background: none; text-align: left; width: 100%; cursor: pointer;
}
.nav-link:hover { background: var(--surface-2); color: var(--ink); }
.nav-link[aria-current="page"] { background: var(--accent-soft); color: var(--ink); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
.nav-link .label { flex: 1; min-width: 0; }
.nav-stage .label { display: flex; flex-direction: column; }
.nav-stage .label small { color: var(--ink-3); font-size: .76rem; }
.tag {
  font: 600 .74rem/1 var(--font-mono); padding: 4px 6px; border-radius: 4px; border: 1px solid var(--line-strong);
  background: var(--tag-bg); color: var(--ink-2); letter-spacing: .02em; flex: none; font-variant-numeric: tabular-nums;
}
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; border: 2px solid var(--line-strong); }
.dot.done { background: var(--good); border-color: var(--good); }
.dot.progress { background: var(--warn); border-color: var(--warn); }
.dot.blocked { background: var(--bad); border-color: var(--bad); }

.meter { height: 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .3s ease; }
.meter.thin { height: 6px; }
.meter-label { display: flex; justify-content: space-between; font-size: .8rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px;
  padding-block: 10px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
}
.topbar .crumb { flex: 1; min-width: 0; font-size: .9rem; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .pct { font-size: .85rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.icon-btn {
  display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink-2); cursor: pointer; flex: none;
}
.icon-btn:hover { color: var(--ink); border-color: var(--line-strong); }
.menu-btn { display: none; }
.content {
  width: 100%; max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px;
  padding-block: 26px 70px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
}

/* Generic blocks */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
.panel.soft { background: var(--surface-2); box-shadow: none; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.btn {
  display: inline-flex; align-items: center; gap: 7px; padding: 8px 13px; border-radius: 8px; border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; font-size: .9rem; font-weight: 550; line-height: 1.2;
}
.btn:hover { border-color: var(--accent); color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--accent-ink); }
.btn.open { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); color: var(--accent); }
.btn.open:hover { background: var(--accent-soft); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
.btn.small { padding: 5px 9px; font-size: .82rem; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 5px 9px; border-radius: 7px; border: 1px dashed var(--line-strong);
  background: var(--tag-bg); cursor: pointer; font: 500 .84rem/1.3 var(--font-mono); color: var(--ink); text-align: left;
}
.chip:hover { border-style: solid; border-color: var(--accent); }
.chip .k { font-family: var(--font-ui); color: var(--ink-3); font-size: .78rem; }
.chip span.v { overflow-wrap: anywhere; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: .76rem; font-weight: 650; padding: 3px 9px; border-radius: 999px; white-space: nowrap; border: 1px solid transparent; }
.pill.done { background: var(--good-soft); color: var(--good); }
.pill.progress { background: var(--warn-soft); color: var(--warn); }
.pill.blocked { background: var(--bad-soft); color: var(--bad); }
.pill.todo { background: var(--surface-2); color: var(--ink-3); border-color: var(--line); }
.pill.optional { background: var(--info-soft); color: var(--info); }
.pill.where { background: var(--surface-2); color: var(--ink-2); border-color: var(--line); font-weight: 600; white-space: normal; max-width: 100%; }
.callout { border-radius: 8px; padding: 10px 12px; font-size: .92rem; display: flex; gap: 10px; align-items: flex-start; }
.callout .svg { margin-top: 3px; }
.callout.note { background: var(--info-soft); color: var(--ink); }
.callout.note .svg { color: var(--info); }
.callout.see { background: var(--good-soft); color: var(--ink); }
.callout.see .svg { color: var(--good); }
.callout.warn { background: var(--warn-soft); color: var(--ink); }
.callout.warn .svg { color: var(--warn); }
.callout > div { min-width: 0; }
.term {
  font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: help;
  text-decoration: underline dotted color-mix(in srgb, var(--accent) 70%, transparent); text-underline-offset: 3px; text-decoration-thickness: 1.5px;
}
.term:hover { color: var(--accent); }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .74rem; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); font-weight: 650; background: var(--surface-2); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.mono, td .mono { font-family: var(--font-mono); font-size: .84rem; }
td input[type="text"], td input[type="number"], td select { width: 100%; min-width: 7rem; }
input[type="text"], input[type="url"], input[type="number"], input[type="date"], input[type="search"], select, textarea {
  border: 1px solid var(--line-strong); border-radius: 7px; background: var(--surface); padding: 7px 9px; font-size: .92rem; min-width: 0;
}
textarea { width: 100%; min-height: 84px; resize: vertical; font-family: var(--font-mono); font-size: .84rem; }
input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: .84rem; color: var(--ink-2); font-weight: 550; min-width: 0; }
label.field input, label.field textarea, label.field select { width: 100%; }

/* Hero and stage map */
.hero { display: flex; flex-direction: column; gap: 14px; }
.hero .lede { font-size: 1.05rem; color: var(--ink-2); max-width: 62ch; }
.next-card { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
.next-card .what { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1 1 320px; }
.stage-map { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.stage-tile { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); text-decoration: none; color: var(--ink); min-width: 0; }
.stage-tile:hover { border-color: var(--accent); color: var(--ink); }
.stage-tile .t { font-weight: 620; font-size: .92rem; line-height: 1.3; }
.stage-tile .row { justify-content: space-between; }
.routine { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.routine ol { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; font-size: .92rem; color: var(--ink-2); }
.rules { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }

/* Stage page */
.stage-head { display: flex; flex-direction: column; gap: 12px; }
.stage-head .row { gap: 10px; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.facts .panel { padding: 14px 16px; gap: 6px; }
.before { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; color: var(--ink-2); }
.steps { display: flex; flex-direction: column; gap: 12px; }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.step.is-next { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.step-head { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; }
.step-head .tick { padding-top: 2px; }
.step-head .tick input { width: 22px; height: 22px; cursor: pointer; }
.step-title { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.step-title .row { gap: 8px; }
.step-title h3 { flex: 1 1 auto; min-width: 0; }
.step-toggle { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; color: inherit; display: flex; gap: 8px; align-items: baseline; font: inherit; }
.step-toggle > span:last-child { min-width: 0; flex: 1; }
.step-toggle:hover h3 { color: var(--accent); }
.step-done-at { font-size: .8rem; color: var(--good); font-weight: 600; }
.step-body { padding: 0 16px 16px 50px; display: flex; flex-direction: column; gap: 12px; }
.step.is-done .step-head h3 { color: var(--ink-2); }
.step.is-collapsed .step-body { display: none; }
.do { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; }
.do li::marker { color: var(--ink-3); font-variant-numeric: tabular-nums; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.hint { font-size: .82rem; color: var(--ink-3); }
.record { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.record .wide { grid-column: 1 / -1; }
.link-slot { display: contents; }
.what { margin: 0; padding: 9px 12px; border-left: 3px solid var(--accent); background: var(--surface-2); border-radius: 0 8px 8px 0; font-size: .94rem; color: var(--ink); }
.form-block { display: flex; flex-direction: column; gap: 6px; }
.form-title { font-size: .76rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }
table.form td.f { font-weight: 600; min-width: 8.5em; }
table.form td .note { display: block; margin-top: 3px; font-size: .8rem; color: var(--ink-3); }
.grid-cards { display: flex; flex-direction: column; gap: 8px; }
.grid-card { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.gc-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.gc-values, .gc-inputs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; }
.kv { display: inline-flex; align-items: center; gap: 6px; font-size: .86rem; min-width: 0; }
.kv > .k { color: var(--ink-3); font-size: .78rem; }
.moves { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.moves .panel h2 { font-size: 1.02rem; margin: 0; }
.shot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .88rem; color: var(--ink-2); }
details.help { border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
details.help > summary { cursor: pointer; padding: 8px 12px; font-size: .88rem; font-weight: 600; color: var(--warn); list-style: none; display: flex; gap: 8px; align-items: center; }
details.help > summary::-webkit-details-marker { display: none; }
details.help ul { margin: 0; padding: 0 14px 12px 32px; display: flex; flex-direction: column; gap: 6px; font-size: .9rem; }
.timer { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); }
.timer .clock { font: 600 1.1rem/1 var(--font-mono); font-variant-numeric: tabular-nums; }
.script-box { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface-2); }
.script-box .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.script-box pre { margin: 0; padding: 10px 12px; max-height: 180px; overflow: auto; font: .78rem/1.5 var(--font-mono); color: var(--ink-2); white-space: pre; }
.checks { display: flex; flex-direction: column; gap: 8px; }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; }
.check input { margin-top: 2px; }
.check.done { background: var(--good-soft); border-color: color-mix(in srgb, var(--good) 35%, var(--line)); }
.problems { display: flex; flex-direction: column; gap: 8px; }
.problem { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.problem > summary { cursor: pointer; padding: 10px 12px; font-weight: 600; font-size: .92rem; }
.problem > div { padding: 0 12px 12px; font-size: .92rem; color: var(--ink-2); }
.stage-footer { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
.blocked-box { display: flex; flex-direction: column; gap: 8px; }
.chain { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.chain .link { display: flex; flex-direction: column; gap: 6px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); position: relative; min-width: 0; }
.chain .link .n { font: 600 .72rem/1 var(--font-mono); color: var(--ink-3); }
.chain .link .name { font-weight: 640; font-size: .95rem; overflow-wrap: anywhere; }
.chain .link p { font-size: .82rem; color: var(--ink-2); }
.outcomes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.outcome { border-radius: 8px; padding: 12px; border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 6px; }
.glossary-list { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.glossary-list dt, .glossary-list dd { margin: 0; padding: 9px 12px; border-bottom: 1px solid var(--line); }
.glossary-list dt { font-weight: 640; background: var(--surface-2); }
.dropzone { border: 2px dashed var(--line-strong); border-radius: var(--radius); padding: 22px; text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; background: var(--surface); }
.dropzone.over { border-color: var(--accent); background: var(--accent-soft); }
pre.preview { margin: 0; white-space: pre-wrap; word-break: break-word; font: .82rem/1.55 var(--font-mono); background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px; max-height: 420px; overflow: auto; }
.banner { display: flex; gap: 10px; align-items: flex-start; background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 35%, var(--line)); border-radius: 8px; padding: 10px 12px; font-size: .9rem; }
.toast {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60;
  background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 8px; font-size: .9rem; box-shadow: var(--shadow); max-width: min(92vw, 520px);
}
.popover {
  position: fixed; z-index: 50; max-width: min(340px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong);
  border-radius: 10px; box-shadow: var(--shadow); padding: 12px 14px; font-size: .9rem; display: flex; flex-direction: column; gap: 6px;
}
.popover strong { font-family: var(--font-display); }
.modal-back { position: fixed; inset: 0; background: rgba(10, 16, 18, .45); z-index: 70; display: grid; place-items: center; padding: 16px; }
.modal { width: min(720px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--surface); border-radius: 12px; border: 1px solid var(--line); box-shadow: var(--shadow); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.modal textarea { min-height: 260px; }
.scrim { display: none; }

@media (max-width: 1080px) {
  .stage-map { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); background: var(--bg); }
  .rail { position: fixed; left: 0; top: 0; bottom: 0; width: min(86vw, var(--rail)); z-index: 40; transform: translateX(-100%); visibility: hidden; box-shadow: none; transition: transform .2s ease, visibility 0s linear .2s; padding-top: calc(18px + env(safe-area-inset-top, 0px)); padding-left: max(14px, env(safe-area-inset-left, 0px)); border-right: 1px solid var(--line); }
  body.nav-open .rail { transform: none; visibility: visible; box-shadow: var(--shadow); transition: transform .2s ease; }
  body.nav-open .scrim { display: block; position: fixed; inset: 0; z-index: 30; background: rgba(10, 16, 18, .4); }
  .menu-btn { display: inline-grid; }
  .facts, .grid-2, .grid-3, .routine, .record, .outcomes { grid-template-columns: minmax(0, 1fr); }
  .step-body { padding-left: 16px; }
}
@media (max-width: 520px) {
  .stage-map { grid-template-columns: minmax(0, 1fr); }
  .glossary-list { grid-template-columns: minmax(0, 1fr); }
  .glossary-list dt { border-bottom: 0; }
  h1 { font-size: 1.5rem; }
  .content { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .topbar { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
@media print {
  .rail, .topbar, .scrim, .actions .btn.open, .no-print, .toast, .popover { display: none !important; }
  .app { display: block; }
  body { background: #fff; color: #000; font-size: 12px; }
  .step.is-collapsed .step-body { display: flex; }
  details.help, .problem { break-inside: avoid; }
  details > *:not(summary) { display: block !important; }
  .step { break-inside: avoid; box-shadow: none; }
}

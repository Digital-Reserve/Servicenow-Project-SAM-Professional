license check","short":"Purchases and license check","time":"about 2 hours","goal":"Record the 5 purchases, hand out the Acrobat and Project licenses, run the license check and read the five results.","why":"This is the heart of SAM: comparing what is installed with what was bought. The result shows where we are short, which is an audit risk, and where we pay for licenses nobody uses.","before":["Stage 3 is finished: 5 software models, each with a matching discovery model."],"steps":[{"id":"s4-1","num":"4.1","title":"Start the change log for this stage","where":"Your instance","what":"Creates an [[update set]] for this stage. It records every setting we change, so Stage 6 can export it as a backup.","do":["Click **Update sets** below. The list **Local Update Sets** opens.","Click **New** at the top of the list. An empty update set form opens.","Fill in **Name** as shown in the table.","Click **Submit and Make Current**."],"form":[{"title":"Update set form","rows":[{"field":"Name","value":"SAM Portfolio S4 Entitlements"}]}],"links":[{"label":"Update sets","path":"sys_update_set_list.do?sysparm_query=nameSTARTSWITHSAM%20Portfolio%5EORDERBYname"}],"see":"The list shows **SAM Portfolio S4 Entitlements** with State **In progress**, and the globe icon in the top bar shows it as your current update set.","help":["There is only a **Submit** button: click it, click the new update set in the list, then click **Make This My Current Set**.","To check the current update set at any time, click the globe icon in the top bar. No globe icon: click your picture (top right), **Preferences**, **Developer**, and switch on **Show update set picker in header**."]},{"id":"s4-ent-a","num":"4.2","title":"Enter purchase A: Adobe Acrobat Pro","where":"Software Asset Workspace","what":"Records our Acrobat purchase: 40 named-user subscriptions at EUR 192 each, valid until 31 January 2027.","do":["Open the **Software Asset Workspace** (All, Software Asset Workspace). It opens on **Software asset overview**.","Click **Create entitlement**. A box opens.","Choose **Fill out the details in a standard form** and click **Next**. The page **Create New Software Entitlement** opens.","Fill in the fields of the first table. Leave every other field as it is.","Click **Save**. Four tabs appear: **Allocations**, **General**, **Financial** and **Contracts**.","Fill in the fields of the second table on the **General** and **Financial** tabs. Click **Save** again.","Click **Publish**. The State changes from **Build** to **In use**."],"form":[{"title":"First screen","rows":[{"field":"Software model","value":"Adobe Acrobat Pro","note":"type the first letters and pick our model"},{"field":"Asset tag","value":"NSM-ENT-A"},{"field":"License type","value":"Subscription","copy":false},{"field":"License metric","value":"Per Named User","note":"not offered: choose the closest, see If not","copy":false},{"field":"Subscription period","value":"Annually","note":"only if the form shows it","copy":false},{"field":"Start date","value":"2026-02-01"},{"field":"End date","value":"2027-01-31"},{"field":"Purchased rights","value":"40"},{"field":"Unit cost","value":"192.00","note":"price of one user per year"}]},{"title":"After the first Save: General and Financial tabs","rows":[{"field":"Company (General tab)","value":"Northstar Manufacturing"},{"field":"Vendor (Financial tab)","value":"Synthetic Reseller BV"},{"field":"Invoice number (Financial tab)","value":"NSM-INV-2026-0101"},{"field":"Purchased (Financial tab)","value":"2026-01-15"}]}],"links":[{"label":"Entitlement (classic form)","path":"alm_license.do?sys_id=-1&sysparm_query=asset_tag%3DNSM-ENT-A"}],"see":"The entitlement shows Asset tag **NSM-ENT-A**, 40 purchased rights and State **In use**.","help":["The workspace is missing or **Create entitlement** does nothing: click the button **Entitlement (classic form)** in this step. Fill in both tables (Company is on the **General** tab, the other three on the **Financial** tab), set **State** on the **General** tab to **In use** and click **Submit**.","**Per Named User** is not offered: choose **Per User**. Both give 40 of 40 in the license check.","**Publish** is not shown: a required field is still empty. Look for a red star or a red message at the top.","Dates: type them as shown (2026-02-01) or pick them with the calendar icon."],"note":"The [[asset tag]] NSM-ENT-A to NSM-ENT-E is how the scripts, reports and backups find our five purchases. [[Unit cost]] is the price of one right (one user, one device or one core): ServiceNow multiplies it by the number of rights.","shot":"S4_01_entitlement_form.png"},{"id":"s4-ent-b","num":"4.3","title":"Enter purchase B: SQL Server Standard","where":"Software Asset Workspace","what":"Records our SQL Server purchase: 16 core licenses, bought as 8 packs of 2 cores at EUR 3,945 per pack.","do":["Open the **Software Asset Workspace** (All, Software Asset Workspace). It opens on **Software asset overview**.","Click **Create entitlement**. A box opens.","Choose **Fill out the details in a standard form** and click **Next**. The page **Create New Software Entitlement** opens.","Fill in the fields of the first table. Leave every other field as it is.","Click **Save**. Four tabs appear: **Allocations**, **General**, **Financial** and **Contracts**.","Fill in the fields of the second table on the **General** and **Financial** tabs. Click **Save** again.","Click **Publish**. The State changes from **Build** to **In use**."],"form":[{"title":"First screen","rows":[{"field":"Software model","value":"Microsoft SQL Server Standard","note":"type the first letters and pick our model"},{"field":"Asset tag","value":"NSM-ENT-B"},{"field":"License type","value":"Perpetual","copy":false},{"field":"License metric","value":"Per Core","copy":false},{"field":"Rights per license pack","value":"2"},{"field":"Number of packs","value":"8"},{"field":"Purchased rights","value":"16","note":"fills itself in: packs x rights per pack","copy":false},{"field":"Unit cost","value":"1972.50","note":"price of ONE core: a pack of 2 cores costs EUR 3,945"}]},{"title":"After the first Save: General and Financial tabs","rows":[{"field":"Company (General tab)","value":"Northstar Manufacturing"},{"field":"Vendor (Financial tab)","value":"Synthetic Reseller BV"},{"field":"Invoice number (Financial tab)","value":"NSM-INV-2025-0877"},{"field":"Purchased (Financial tab)","value":"2025-11-20"}]}],"links":[{"label":"Entitlement (classic form)","path":"alm_license.do?sys_id=-1&sysparm_query=asset_tag%3DNSM-ENT-B"}],"see":"The entitlement shows Asset tag **NSM-ENT-B**, 16 purchased rights and State **In use**.","help":["The workspace is missing or **Create entitlement** does nothing: click the button **Entitlement (classic form)** in this step. Fill in both tables (Company is on the **General** tab, the other three on the **Financial** tab), set **State** on the **General** tab to **In use** and click **Submit**.","Choose **Per Core**, not **Per Core (with CAL)**. No plain Per Core: choose the metric with **Core** in its name and write it down.","**Publish** is not shown: a required field is still empty. Look for a red star or a red message at the top.","Dates: type them as shown (2026-02-01) or pick them with the calendar icon."]},{"id":"s4-ent-c","num":"4.4","title":"Enter purchase C: Visio Professional","where":"Software Asset Workspace","what":"Records our Visio purchase: 60 device licenses at EUR 579 each.","do":["Open the **Software Asset Workspace** (All, Software Asset Workspace). It opens on **Software asset overview**.","Click **Create entitlement**. A box opens.","Choose **Fill out the details in a standard form** and click **Next**. The page **Create New Software Entitlement** opens.","Fill in the fields of the first table. Leave every other field as it is.","Click **Save**. Four tabs appear: **Allocations**, **General**, **Financial** and **Contracts**.","Fill in the fields of the second table on the **General** and **Financial** tabs. Click **Save** again.","Click **Publish**. The State changes from **Build** to **In use**."],"form":[{"title":"First screen","rows":[{"field":"Software model","value":"Microsoft Visio Professional","note":"type the first letters and pick our model"},{"field":"Asset tag","value":"NSM-ENT-C"},{"field":"License type","value":"Perpetual","copy":false},{"field":"License metric","value":"Per Device","note":"not offered: choose the closest, see If not","copy":false},{"field":"Purchased rights","value":"60"},{"field":"Unit cost","value":"579.00","note":"price of one device license"}]},{"title":"After the first Save: General and Financial tabs","rows":[{"field":"Company (General tab)","value":"Northstar Manufacturing"},{"field":"Vendor (Financial tab)","value":"Synthetic Reseller BV"},{"field":"Invoice number (Financial tab)","value":"NSM-INV-2025-0412"},{"field":"Purchased (Financial tab)","value":"2025-06-10"}]}],"links":[{"label":"Entitlement (classic form)","path":"alm_license.do?sys_id=-1&sysparm_query=asset_tag%3DNSM-ENT-C"}],"see":"The entitlement shows Asset tag **NSM-ENT-C**, 60 purchased rights and State **In use**.","help":["The workspace is missing or **Create entitlement** does nothing: click the button **Entitlement (classic form)** in this step. Fill in both tables (Company is on the **General** tab, the other three on the **Financial** tab), set **State** on the **General** tab to **In use** and click **Submit**.","**Per Device** is not offered: choose **Per Installation** and write it down.","**Publish** is not shown: a required field is still empty. Look for a red star or a red message at the top.","Dates: type them as shown (2026-02-01) or pick them with the calendar icon."]},{"id":"s4-ent-d","num":"4.5","title":"Enter purchase D: Project Professional","where":"Software Asset Workspace","what":"Records our Project purchase: 30 device licenses at EUR 1,059 each.","do":["Open the **Software Asset Workspace** (All, Software Asset Workspace). It opens on **Software asset overview**.","Click **Create entitlement**. A box opens.","Choose **Fill out the details in a standard form** and click **Next**. The page **Create New Software Entitlement** opens.","Fill in the fields of the first table. Leave every other field as it is.","Click **Save**. Four tabs appear: **Allocations**, **General**, **Financial** and **Contracts**.","Fill in the fields of the second table on the **General** and **Financial** tabs. Click **Save** again.","Click **Publish**. The State changes from **Build** to **In use**."],"form":[{"title":"First screen","rows":[{"field":"Software model","value":"Microsoft Project Professional","note":"type the first letters and pick our model"},{"field":"Asset tag","value":"NSM-ENT-D"},{"field":"License type","value":"Perpetual","copy":false},{"field":"License metric","value":"Per Device","note":"not offered: choose the closest, see If not","copy":false},{"field":"Purchased rights","value":"30"},{"field":"Unit cost","value":"1059.00","note":"price of one device license"}]},{"title":"After the first Save: General and Financial tabs","rows":[{"field":"Company (General tab)","value":"Northstar Manufacturing"},{"field":"Vendor (Financial tab)","value":"Synthetic Reseller BV"},{"field":"Invoice number (Financial tab)","value":"NSM-INV-2025-0413"},{"field":"Purchased (Financial tab)","value":"2025-06-10"}]}],"links":[{"label":"Entitlement (classic form)","path":"alm_license.do?sys_id=-1&sysparm_query=asset_tag%3DNSM-ENT-D"}],"see":"The entitlement shows Asset tag **NSM-ENT-D**, 30 purchased rights and State **In use**.","help":["The workspace is missing or **Create entitlement** does nothing: click the button **Entitlement (classic form)** in this step. Fill in both tables (Company is on the **General** tab, the other three on the **Financial** tab), set **State** on the **General** tab to **In use** and click **Submit**.","**Per Device** is not offered: choose **Per Installation** and write it down.","**Publish** is not shown: a required field is still empty. Look for a red star or a red message at the top.","Dates: type them as shown (2026-02-01) or pick them with the calendar icon."]},{"id":"s4-ent-e","num":"4.6","title":"Enter purchase E: Windows Server Standard","where":"Software Asset Workspace","what":"Records our Windows Server purchase: 112 core licenses, bought as 56 packs of 2 cores.","do":["Open the **Software Asset Workspace** (All, Software Asset Workspace). It opens on **Software asset overview**.","Click **Create entitlement**. A box opens.","Choose **Fill out the details in a standard form** and click **Next**. The page **Create New Software Entitlement** opens.","Fill in the fields of the first table. Leave every other field as it is.","Click **Save**. Four tabs appear: **Allocations**, **General**, **Financial** and **Contracts**.","Fill in the fields of the second table on the **General** and **Financial** tabs. Click **Save** again.","Click **Publish**. The State changes from **Build** to **In use**."],"form":[{"title":"First screen","rows":[{"field":"Software model","value":"Microsoft Windows Server Standard","note":"type the first letters and pick our model"},{"field":"Asset tag","value":"NSM-ENT-E"},{"field":"License type","value":"Perpetual","copy":false},{"field":"License metric","value":"Per Core","copy":false},{"field":"Rights per license pack","value":"2"},{"field":"Number of packs","value":"56"},{"field":"Purchased rights","value":"112","note":"fills itself in: packs x rights per pack","copy":false},{"field":"Unit cost","value":"124.00","note":"price of ONE core: a pack of 2 cores costs EUR 248"}]},{"title":"After the first Save: General and Financial tabs","rows":[{"field":"Company (General tab)","value":"Northstar Manufacturing"},{"field":"Vendor (Financial tab)","value":"Synthetic Reseller BV"},{"field":"Invoice number (Financial tab)","value":"NSM-INV-2025-0150"},{"field":"Purchased (Financial tab)","value":"2025-03-05"}]}],"links":[{"label":"Entitlement (classic form)","path":"alm_license.do?sys_id=-1&sysparm_query=asset_tag%3DNSM-ENT-E"}],"see":"The entitlement shows Asset tag **NSM-ENT-E**, 112 purchased rights and State **In use**.","help":["The workspace is missing or **Create entitlement** does nothing: click the button **Entitlement (classic form)** in this step. Fill in both tables (Company is on the **General** tab, the other three on the **Financial** tab), set **State** on the **General** tab to **In use** and click **Submit**.","Choose **Per Core**, not **Per Core (with CAL)**. No plain Per Core: choose the metric with **Core** in its name and write it down.","**Publish** is not shown: a required field is still empty. Look for a red star or a red message at the top.","Dates: type them as shown (2026-02-01) or pick them with the calendar icon."]},{"id":"s4-3","num":"4.7","title":"Check that all five purchases are In use","where":"Your instance","what":"Confirms all five purchases are published. The license check ignores entitlements still in State **Build**.","do":["Click **Our entitlements** below. It lists the entitlements whose asset tag starts with NSM-ENT.","Read the **State** column of each row. No State column: open each entitlement and look on its **General** tab.","Choose the State for each row in the table."],"links":[{"label":"Our entitlements","path":"alm_license_list.do?sysparm_query=asset_tagSTARTSWITHNSM-ENT%5EORDERBYasset_tag"}],"grid":{"id":"ents_in_use","rowLabel":"Entitlement","summary":true,"rate":{"column":"state","good":["In use"],"label":"Published","fact":"Northstar entitlements in use"},"columns":[{"key":"state","label":"State shown","type":"select","options":["In use","Build","Other"]}],"rows":[{"id":"A","label":"NSM-ENT-A  Adobe Acrobat Pro"},{"id":"B","label":"NSM-ENT-B  SQL Server Standard"},{"id":"C","label":"NSM-ENT-C  Visio Professional"},{"id":"D","label":"NSM-ENT-D  Project Professional"},{"id":"E","label":"NSM-ENT-E  Windows Server Standard"}]},"see":"5 rows, NSM-ENT-A to NSM-ENT-E, all with State **In use**.","help":["A row shows **Build**: open it and click **Publish**. In the classic form, set **State** to **In use** on the General tab and click **Update**."],"shot":"S4_02_entitlements_published.png"},{"id":"s4-4","num":"4.8","title":"Hand out the licenses","where":"Your instance","script":"02_allocate_licenses.js","what":"Gives one Acrobat license to each of the 40 Acrobat users and one Project license to each of the 28 laptops with Project. One script does all 68 [[allocation|allocations]].","do":["Click **Scripts - Background** below.","Click **Copy script**, paste it into the big text box and click **Run script**.","Copy the result lines into the box below."],"links":[{"label":"Scripts - Background","path":"sys.scripts.do"}],"note":"An allocation ties a license to a named person or computer. The script finds the purchases by their asset tags NSM-ENT-A and NSM-ENT-D.","see":"Acrobat: **40 created**. Project: **28 created**. Both found by asset tag, with State In use.","help":["\"No Acrobat entitlement found\": check that purchase A exists with Asset tag **NSM-ENT-A** (step 4.2), then run again.","A note says the State is Build: publish that entitlement (step 4.7) and run the script again. It never creates duplicates.","Prefer clicking: open the Acrobat entitlement, open the **Allocations** tab and add the 40 users listed in **10_allocations.csv** (Northstar files)."],"record":[{"id":"alloc_result","label":"Result lines","type":"textarea"}],"shot":"S4_03_allocations.png"},{"id":"s4-5","num":"4.9","title":"Run the license check","where":"Your instance","timer":true,"wait":"5 to 15 minutes","what":"Runs the [[reconciliation|license check]] now instead of waiting for its weekly automatic run. It compares installations and allocations with what we bought.","do":["Click **License check job** below. A list of scheduled jobs opens.","Click **SAM - Software License Reconciliation**.","Click **Execute Now** at the top right. Then click **Start timer** below.","Click **Reconciliation runs** below. The newest run is at the top. Reload the page every few minutes.","The run is finished when the newest row shows it ended (for example a state such as Completed, or an end time)."],"links":[{"label":"License check job","path":"sysauto_list.do?sysparm_query=nameLIKEreconcil"},{"label":"Reconciliation runs","path":"samp_reconciliation_result_list.do?sysparm_query=ORDERBYDESCsys_created_on"}],"note":"Another way to start it: on the workspace page **Software asset overview**, click **Run reconciliation**. Never start a second run while one is still going.","see":"The newest reconciliation run finished without errors.","help":["The job name differs: open the job that mentions Software License Reconciliation."]},{"id":"s4-6","num":"4.10","title":"Read the five results","where":"Software Asset Workspace","what":"Writes down the five [[license position|license positions]]: the core result of the whole project.","do":["Open the **Software Asset Workspace** and click **License usage** in the menu on the left.","Click **Adobe**, then **Microsoft**, and find our five products. Or click **Results by product** below: it lists the newest results of our five models first.","For each product, type what the system shows for **Owned** and **Used**, and choose the **Position** in the table."],"links":[{"label":"Results by product","path":"samp_software_model_result_list.do?sysparm_query=software_model.short_descriptionSTARTSWITHNorthstar%5EORDERBYDESCsys_created_on"}],"grid":{"id":"positions","rowLabel":"Story","summary":true,"columns":[{"key":"exp","label":"Expected","fixed":true},{"key":"owned","label":"Owned","type":"text"},{"key":"used","label":"Used","type":"text"},{"key":"position","label":"Position shown","type":"select","options":["Compliant","Under-licensed","Over-licensed","Other"]}],"rows":[{"id":"A","label":"A  Acrobat","exp":"40 owned, 40 used, compliant"},{"id":"B","label":"B  SQL Server","exp":"16 owned, 24 used, under-licensed"},{"id":"C","label":"C  Visio","exp":"60 owned, 35 used, over-licensed"},{"id":"D","label":"D  Project","exp":"30 owned, 28 used, compliant"},{"id":"E","label":"E  Windows Server","exp":"112 owned, 112 used, compliant"}]},"note":"Under-licensed means a [[true-up]] risk: a bill after an audit. Over-licensed means money tied up in licenses nobody uses.","see":"A compliant, B short by 8 cores, C 25 licenses unused, D compliant with 2 spare, E compliant.","help":["A product shows 0 used: open its software model and check **Matching Discovery Models** (step 3.11), fix it and run the license check again.","Windows Server shows 88 instead of 112: the system counted the actual cores without Microsoft's minimums. Write it down; Stage 5 explains the difference."],"shot":"S4_04_results_overview.png"},{"id":"s4-7","num":"4.11","title":"Follow one result back to its source","where":"Software Asset Workspace","what":"Proves that every number can be explained, by tracing the SQL Server shortage back to the three servers.","do":["Open the SQL Server result (from step 4.10). It shows 24 cores needed and 16 owned.","Open the purchase: entitlement **NSM-ENT-B** shows 16 cores in 8 packs of 2.","Open the installations of SQL Server: 3 servers, NSM-SQL-01 to NSM-SQL-03.","Open **NSM-SQL-01**: CPU count 2, CPU core count 4, so 8 cores. 3 servers times 8 cores is 24."],"links":[{"label":"NSM-ENT-B","path":"alm_license_list.do?sysparm_query=asset_tag%3DNSM-ENT-B"},{"label":"SQL Server installations","path":"cmdb_sam_sw_install_list.do?sysparm_query=installed_on.nameSTARTSWITHNSM-%5Edisplay_name%3DMicrosoft%20SQL%20Server%202022%20Standard%20Edition"}],"see":"You can explain where 24 and 16 come from.","shot":"S4_05_trace_sql_server.png"},{"id":"s4-8","num":"4.12","title":"Look at the fix options","where":"Software Asset Workspace","what":"Shows the [[remediation]] options ServiceNow offers for the SQL Server shortage, and what buying the missing licenses would cost.","do":["Open the SQL Server result in **License usage**.","Open **Remediation options**.","Look at the choices, such as buying more licenses or removing installations. Do not run any of them.","Write down the price the system shows for buying the missing licenses."],"see":"The options, and a purchase price of 8 cores x EUR 1,972.50 = **EUR 15,780** (4 packs of 2 cores at EUR 3,945), or the system's own figure.","record":[{"id":"remediation_price","label":"Price shown to buy the missing SQL Server licenses (EUR)","fact":true}],"shot":"S4_06_remediation_options.png"}],"checks":[{"id":"s4-c1","text":"5 entitlements exist with asset tags NSM-ENT-A to NSM-ENT-E, all in State In use."},{"id":"s4-c2","text":"40 Acrobat user allocations and 28 Project device allocations exist."},{"id":"s4-c3","text":"The license check finished without errors."},{"id":"s4-c4","text":"The results are recorded: A compliant, B under-licensed, C over-licensed, D and E compliant."},{"id":"s4-c5","text":"The SQL Server result is traced back to the servers."}],"problems":[{"problem":"The workspace is not available","fix":"Use the button Entitlement (classic form) in each purchase step. Fill in the same values, set State to In use on the General tab and click Submit."},{"problem":"An entitlement cannot be published","fix":"A required field is empty. The form highlights it. Usually it is the software model, the metric or the rights."},{"problem":"Per core numbers differ from the table","fix":"Check CPU count and CPU core count on the servers (step 2.5) and that a Microsoft plugin is in the plugin list (step 1.5). Write down what the system shows. Both readings can be explained."},{"problem":"The license check seems stuck","fix":"Open Reconciliation runs. On a sandbox a run takes minutes. Do not start a second run while one is still going."}]},{"id":"s5","number":5,"title":"Microsoft rules and finding unused software","short":"Vendor rules and unused software","time":"about 2 hours","goal":"Explain the Microsoft per core rules behind two results, add usage data, and let a reclamation rule find the 12 Project installations nobody uses.","why":"Counting installations is not enough. Vendors have their own rules, and the cheapest license is the one you take back from someone who does not use it.","before":["Stage 4 is finished: the five results are recorded."],"steps":[{"id":"s5-1","num":"5.1","title":"Start the change log for this stage","where":"Your instance","what":"Creates an [[update set]] for this stage. It records every setting we change, so Stage 6 can export it as a backup.","do":["Click **Update sets** below. The list **Local Update Sets** opens.","Click **New** at the top of the list. An empty update set form opens.","Fill in **Name** as shown in the table.","Click **Submit and Make Current**."],"form":[{"title":"Update set form","rows":[{"field":"Name","value":"SAM Portfolio S5 Optimization"}]}],"links":[{"label":"Update sets","path":"sys_update_set_list.do?sysparm_query=nameSTARTSWITHSAM%20Portfolio%5EORDERBYname"}],"see":"The list shows **SAM Portfolio S5 Optimization** with State **In progress**, and the globe icon in the top bar shows it as your current update set.","help":["There is only a **Submit** button: click it, click the new update set in the list, then click **Make This My Current Set**.","To check the current update set at any time, click the globe icon in the top bar. No globe icon: click your picture (top right), **Preferences**, **Developer**, and switch on **Show update set picker in header**."]},{"id":"s5-2","num":"5.2","title":"Open the Microsoft view","where":"Software Asset Workspace","what":"Shows the results that Microsoft's own licensing rules produce, from the Microsoft [[publisher pack]].","do":["Open the **Software Asset Workspace** and click **License usage** in the menu on the left.","Click **Microsoft**.","Find **Windows Server** and **SQL Server** and open each one."],"see":"The Microsoft products with their positions and the number of cores counted.","shot":"S5_01_microsoft_view.png"},{"id":"s5-3","num":"5.3","title":"Understand the per core rule","where":"This guide","what":"Explains in plain numbers why Windows Server needs 112 core licenses and SQL Server 24. You will be asked about this in every demo.","do":["**Windows Server Standard** is licensed per core. Every physical server needs at least 16 core licenses, and every processor at least 8. Licenses come in packs of 2.","Our 4 application servers have 16 cores each: 64. Our 3 SQL servers have only 8 cores each, but the minimum is 16 per server: 48. Together 112. We own 112: **compliant**.","**SQL Server Standard** is licensed per core with at least 4 per processor. 3 servers with 2 processors of 4 cores need 24. We own 16: **8 short**. 8 cores at EUR 1,972.50 (4 packs of 2 cores at EUR 3,945) make **EUR 15,780** to pay after an audit.","Compare this with the Microsoft view from step 5.2 and write down what the system shows."],"note":"Without the Microsoft rules a tool counts raw cores: 88 for Windows Server. [[Per core licensing]] minimums are why the right answer is 112.","see":"You can explain 112 and 24 without notes.","record":[{"id":"percore_notes","label":"What the system shows, and any difference","type":"textarea","fact":true}],"shot":"S5_02_per_core_detail.png"},{"id":"s5-4","num":"5.4","title":"Add the usage data","where":"Your instance","script":"03_load_usage.js","what":"Adds [[software usage]]: when each Acrobat, Visio and Project installation was last used and for how long. 12 Project installations were last used more than 90 days ago.","do":["Click **Scripts - Background** below.","Click **Copy script**, paste it into the big text box and click **Run script**.","Copy the result lines into the box below.","Click **Software usage** below and check the count at the bottom right."],"links":[{"label":"Scripts - Background","path":"sys.scripts.do"},{"label":"Software usage","path":"samp_sw_usage_list.do?sysparm_query=ORDERBYDESCsys_created_on"}],"note":"Usage normally comes from an agent on each computer or from Microsoft SCCM. The script plays that role.","see":"**Usage rows: 103 created**, followed by the list of fields it filled. The usage list shows 103 more rows.","help":["A note says no last-used field was found: carry on. The rule option **Include no activity** in step 5.5 still finds the unused installations."],"record":[{"id":"usage_result","label":"Result lines","type":"textarea"}],"shot":"S5_03_usage_records.png"},{"id":"s5-5","num":"5.5","title":"Create the reclamation rule","where":"Software Asset Workspace","what":"Creates the [[reclamation rule]] that decides when an installation counts as unused: not used for 3 months.","do":["Open the **Software Asset Workspace**, click **License operations**, then **Reclamation rules**, then **New**. Classic way: All, Software Asset, Administration, Reclamation Rules, New.","Fill in the fields as shown in the table. Leave every other field as it is.","Click **Submit** (or **Save**).","Open the rule again. In the **Software Products** list at the bottom, click **Edit...** (or **New**).","Add **Project** by **Microsoft** and save."],"form":[{"title":"Reclamation rule form","rows":[{"field":"Name","value":"Northstar - Project unused 3 months"},{"field":"Applies to","value":"Software installations","note":"the choice for installed software, not SaaS","copy":false},{"field":"Reclamation type","value":"Last Used Date","copy":false},{"field":"Last used before","value":"3 months","copy":false},{"field":"Create reclamation candidate","value":"ticked","copy":false},{"field":"Include no activity","value":"ticked","note":"also catches installations with no usage at all","copy":false},{"field":"Notify user","value":"not ticked","note":"nobody gets an email","copy":false},{"field":"Days before auto-reclamation","value":"leave empty","note":"nothing is removed automatically","copy":false}]}],"links":[{"label":"Our reclamation rule","path":"samp_sw_reclamation_rule_list.do?sysparm_query=nameSTARTSWITHNorthstar"}],"see":"The rule **Northstar - Project unused 3 months** is saved with **Project** in its Software Products list.","shot":"S5_04_reclamation_rule.png"},{"id":"s5-6","num":"5.6","title":"Find the unused installations","where":"Your instance","timer":true,"wait":"10 to 20 minutes","what":"Runs the license check once more with the usage data, then the job that turns the rule into removal candidates.","do":["Click **License check job** below, open **SAM - Software License Reconciliation** and click **Execute Now**.","Click **Reconciliation runs** and wait until the newest run has finished, 5 to 15 minutes. The candidates job needs a fresh license check.","Click **Reclamation jobs** below and open **SAM - Identify new reclamation candidates**. The name can read Identifying instead of Identify.","Click **Execute Now**, then **Start timer** below.","Wait 2 to 5 minutes."],"links":[{"label":"License check job","path":"sysauto_list.do?sysparm_query=nameLIKEreconcil"},{"label":"Reconciliation runs","path":"samp_reconciliation_result_list.do?sysparm_query=ORDERBYDESCsys_created_on"},{"label":"Reclamation jobs","path":"sysauto_list.do?sysparm_query=nameLIKEreclamation"}],"see":"Both jobs ran. The next step shows their result."},{"id":"s5-7","num":"5.7","title":"Check the removal candidates","where":"Software Asset Workspace","what":"Counts the [[removal candidate|removal candidates]]: installations the system suggests taking back.","do":["Open the **Software Asset Workspace**, click **License operations**, then **Removal candidates**. Or click **Removal candidates** below.","Count the candidates for Microsoft Project and type the number in the box below."],"links":[{"label":"Removal candidates","path":"samp_sw_reclamation_candidate_list.do?sysparm_query=ORDERBYDESCsys_created_on"}],"see":"12 candidates, on laptops NSM-WS-026 to NSM-WS-037.","help":["None after 5 minutes: work through **No removal candidates** under Troubleshooting."],"record":[{"id":"candidates","label":"Project removal candidates","type":"number","fact":true}],"shot":"S5_05_removal_candidates.png"},{"id":"s5-8","num":"5.8","title":"Show the savings and the process","where":"Software Asset Workspace","what":"Shows what taking back the unused licenses is worth, and how the take-back process looks. [[Reclamation]] reuses licenses instead of buying new ones.","do":["Open the **Software Asset Workspace**, click **License operations**, then **Reclamation summary**.","Write the potential savings in the box below.","Open one removal candidate and look at its state and buttons. Do not start any uninstall."],"see":"Potential savings of about 12 x EUR 1,059 = EUR 12,708, or the system's own figure.","record":[{"id":"savings","label":"Potential savings shown (EUR)","fact":true}],"shot":"S5_06_savings.png"},{"id":"s5-9","num":"5.9","title":"Look at the automation behind it","where":"Your instance","what":"Shows the automated process a real company runs after a take-back is approved. We only look; nothing is changed or switched on.","do":["Click **All**, type **Workflow Studio** (older name: Flow Designer) and open it.","Search for **reclamation** and open the flow whose name mentions software reclamation.","Look at its steps. Do not change or activate anything."],"see":"Steps such as notify the user, wait, remove the software and return the license to the pool.","shot":"S5_07_reclamation_flow.png"}],"checks":[{"id":"s5-c1","text":"The Microsoft view is open and the per core rule is explained in your own words."},{"id":"s5-c2","text":"103 usage rows exist."},{"id":"s5-c3","text":"The reclamation rule is saved with Project."},{"id":"s5-c4","text":"Removal candidates for Project are found and the savings are recorded."},{"id":"s5-c5","text":"No real computer was touched."}],"problems":[{"problem":"No removal candidates","fix":"1) Open Software usage and check there are Project rows. 2) Check Project is allocated to the laptops (step 4.8). 3) Change the rule to Reclamation type Total Usage Time, Aggregate usage by the last 3 months, Total hours used 1, keep Include no activity ticked, and run both jobs again (step 5.6). 4) Still none: filter Software usage on Project with last used before 3 months ago, take that screenshot as evidence and write it in tracker/decisions.md. The story and the savings stay valid."},{"problem":"The Microsoft view is empty","fix":"Run the license check again (step 4.9) after confirming a Microsoft plugin is in the plugin list (step 1.5)."}]},{"id":"s6","number":6,"title":"Dashboard, visitor login and backup","short":"Dashboard, visitor, backup","time":"2 to 3 hours","goal":"Build one management dashboard, create a read-only visitor login that passes every test, and back up our work into the repository.","why":"Managers want one screen, not lists. A visitor login lets reviewers see the live system without risk. The backup means the project survives if the sandbox is deleted.","before":["Stage 5 is finished: removal candidates and savings are recorded."],"steps":[{"id":"s6-1","num":"6.1","title":"Start the change log for this stage","where":"Your instance","what":"Creates an [[update set]] for this stage. It records every setting we change, so Stage 6 can export it as a backup.","do":["Click **Update sets** below. The list **Local Update Sets** opens.","Click **New** at the top of the list. An empty update set form opens.","Fill in **Name** as shown in the table.","Click **Submit and Make Current**."],"form":[{"title":"Update set form","rows":[{"field":"Name","value":"SAM Portfolio S6 Presentation"}]}],"links":[{"label":"Update sets","path":"sys_update_set_list.do?sysparm_query=nameSTARTSWITHSAM%20Portfolio%5EORDERBYname"}],"see":"The list shows **SAM Portfolio S6 Presentation** with State **In progress**, and the globe icon in the top bar shows it as your current update set.","help":["There is only a **Submit** button: click it, click the new update set in the list, then click **Make This My Current Set**.","To check the current update set at any time, click the globe icon in the top bar. No globe icon: click your picture (top right), **Preferences**, **Developer**, and switch on **Show update set picker in header**."]},{"id":"s6-2","num":"6.2","title":"Look at the built-in analytics","where":"Software Asset Workspace","what":"Checks whether the workspace's own charts already show Northstar numbers.","do":["Open the **Software Asset Workspace** and look at **Software asset overview** and the other views with charts.","Charts are empty: click **Analytics jobs** below (or All, Performance Analytics, Data Collector, Jobs). Open each job that mentions Software Asset or SAM and click **Execute Now**. Wait 10 minutes and reload the workspace."],"links":[{"label":"Analytics jobs","path":"sysauto_pa_list.do?sysparm_query=nameLIKEsoftware%5EORnameLIKEsam"}],"see":"Charts with Northstar numbers. If they stay empty, the next two steps build the dashboard anyway.","shot":"S6_01_workspace_analytics.png"},{"id":"s6-3","num":"6.3","title":"Create the dashboard page","where":"Your instance","what":"Creates the empty dashboard that will answer the five management questions on one screen.","do":["Click **All** and type **Dashboards**. Under **Platform Analytics**, click **Dashboards**.","Click **Create New Dashboard** at the top right. On some versions the button is called **New**.","Fill in the name from the table and click **Create** (or **Save**). The empty dashboard opens in edit mode."],"form":[{"title":"New dashboard","rows":[{"field":"Name","value":"Northstar Software Asset Overview"}]}],"see":"An empty dashboard called **Northstar Software Asset Overview**.","help":["There are no Platform Analytics dashboards: click **All**, type **Dashboards**, open the classic **Dashboards** list and click **New**. Use the same name."]},{"id":"s6-charts","num":"6.4","title":"Add the six charts","where":"Your instance","what":"Fills the dashboard with six charts: what we have, how clean it is, what we own, where the risk is, where we can save and what renews soon.","do":["On the dashboard click **Add New Element** (or the **+** button). Choose **Data Visualization**, then create a new one.","Choose the visualization type shown in the **Type** column, for example **Bar**.","As data source, choose the table shown in the **Table** column: type the first letters of its name and pick it.","Add the condition shown in the **Filter** column, and set **Group by** to the field in the **Group by** column.","Type the name from the **Title** column, save the chart and place it on the dashboard.","Repeat for all six charts, then save the dashboard. Tick each chart in the second table when it is on the dashboard."],"table":{"columns":[{"key":"title","label":"Title"},{"key":"type","label":"Type"},{"key":"table","label":"Table"},{"key":"filter","label":"Filter"},{"key":"group","label":"Group by"}],"rows":[{"title":"Installations by publisher","type":"Bar","table":"Software Installation (cmdb_sam_sw_install)","filter":"Installed on, Name, starts with, NSM-","group":"Publisher"},{"title":"Normalization status","type":"Pie","table":"Software Discovery Model (cmdb_sam_sw_discovery_model)","filter":"none","group":"Normalization status"},{"title":"Rights owned by product","type":"Bar","table":"Software Entitlement (alm_license)","filter":"Asset tag, starts with, NSM-ENT","group":"Software model, showing the sum of Purchased rights"},{"title":"License positions","type":"List","table":"Software Model Result (samp_software_model_result)","filter":"Software model, Short description, starts with, Northstar","group":"Software model"},{"title":"Removal candidates","type":"Single score","table":"Removal candidate (samp_sw_reclamation_candidate)","filter":"Product (or Software model) contains Project","group":"Count of records"},{"title":"Renewals coming up","type":"List","table":"Software Entitlement (alm_license)","filter":"Asset tag, starts with, NSM-ENT, and End date, is not empty","group":"End date"}]},"grid":{"id":"reports_done","rowLabel":"Chart","columns":[{"key":"done","label":"On the dashboard","type":"check"}],"rows":[{"id":"r1","label":"Installations by publisher"},{"id":"r2","label":"Normalization status"},{"id":"r3","label":"Rights owned by product"},{"id":"r4","label":"License positions"},{"id":"r5","label":"Removal candidates"},{"id":"r6","label":"Renewals coming up"}]},"see":"One dashboard that answers: what do we have, how clean is the data, what do we own, where is the risk, where can we save.","help":["No **Data Visualization** option: build each chart as a classic report. Click **All**, type **Reports**, click **Create New**. Type the title as **Report name**, choose **Table** as source type and pick the table, click **Next**. Choose the type, set **Group by** and the filter, click **Save**. Then use **Add to Dashboard** in the menu next to Save.","A chart is empty: check the table and filter. License positions need a finished license check (step 4.9)."],"shot":"S6_02_dashboard.png"},{"id":"s6-4","num":"6.5","title":"Create the read-only visitor","where":"Your instance","what":"Creates the login reviewers use later to look around the live system without being able to change anything.","do":["Click **Users** below, then **New**.","Fill in the form as shown in the table and click **Submit**.","Open **portfolio.visitor** again. In the **Roles** tab at the bottom, click **Edit...**.","In the left box type **sam_user**, select it and click the arrow pointing right. Do the same for **snc_read_only**. Click **Save**.","Click **Set Password**. Click **Generate**, copy the password into your password manager, then click **Save Password**."],"form":[{"title":"New user","rows":[{"field":"User ID","value":"portfolio.visitor"},{"field":"First name","value":"Portfolio"},{"field":"Last name","value":"Visitor"},{"field":"Email","value":"leave empty","copy":false},{"field":"Password needs reset","value":"not ticked","note":"a read-only user cannot change its own password","copy":false},{"field":"Active","value":"not ticked","note":"we switch it on in Stage 7","copy":false}]}],"links":[{"label":"Users","path":"sys_user_list.do"}],"note":"[[snc_read_only]] stops this user from creating, changing or deleting anything. sam_user lets them see the SAM screens.","see":"The visitor exists, is not active, and has exactly 2 roles: sam_user and snc_read_only.","help":["The role list in the left box is long: type the role name in the search field above it."]},{"id":"s6-5","num":"6.6","title":"Test the visitor in a private window","where":"Your instance","what":"Proves the visitor can look at everything that matters and change nothing.","do":["Open **portfolio.visitor**, tick **Active** and click **Update**.","Open a private browser window, go to your instance address and sign in as **portfolio.visitor** with the password from the password manager.","Try every line in the table and choose the result.","Close the private window. Open portfolio.visitor as admin, untick **Active** and click **Update** until Stage 7."],"links":[{"label":"Visitor user","path":"sys_user_list.do?sysparm_query=user_name%3Dportfolio.visitor"}],"grid":{"id":"visitor_tests","rowLabel":"Test","summary":true,"columns":[{"key":"exp","label":"Expected","fixed":true},{"key":"result","label":"Result","type":"select","options":["Pass","Fail"]}],"rows":[{"id":"t1","label":"Open the Software Asset Workspace","exp":"Opens"},{"id":"t2","label":"Open the Northstar dashboard","exp":"Opens"},{"id":"t3","label":"Change an entitlement and save","exp":"Refused"},{"id":"t4","label":"Create a software model","exp":"Refused"},{"id":"t5","label":"Run the license check","exp":"Refused"},{"id":"t6","label":"Create a reclamation rule","exp":"Refused"},{"id":"t7","label":"Open System Properties (sys_properties.list)","exp":"Refused or empty"},{"id":"t8","label":"Change another user","exp":"Refused"},{"id":"t9","label":"Open Scripts - Background","exp":"Refused"},{"id":"t10","label":"Delete any record","exp":"Refused"}]},"see":"Every Opens line works and every Refused line is refused.","help":["The visitor can change something: check that snc_read_only is on the user, sign out and in again, and test again.","The visitor cannot open the dashboard: open it as admin, open its sharing settings and add the visitor or the sam_user role."],"shot":"S6_03_visitor_refused.png"},{"id":"s6-6","num":"6.7","title":"Close and export the update sets","where":"Your instance","what":"Turns the six change logs into six files that can rebuild our configuration on a new sandbox.","do":["Click **Our update sets** below.","Open **SAM Portfolio S1 Foundation**. Set **State** to **Complete** and click **Update**.","Open it again. Under **Related Links** at the bottom, click **Export to XML**. Your browser saves a file.","Do the same for S2 to S6.","Keep the 6 files together in one folder on your computer."],"links":[{"label":"Update sets","path":"sys_update_set_list.do?sysparm_query=nameSTARTSWITHSAM%20Portfolio%5EORDERBYname"}],"note":"An update set can only be exported once it is Complete.","see":"6 XML files on your computer, one per stage.","help":["No **Export to XML** link: the State is not Complete yet. Set it, click Update and open the update set again."]},{"id":"s6-7","num":"6.8","title":"Export our key records","where":"Your instance","what":"Saves our software models, purchases and reclamation rule as files, so they can be loaded into a new sandbox.","do":["Click each button below. Each opens a list filtered to our own records.","In each list, right-click any column heading and choose **Export**, then **XML**.","If a box appears, click **Download**. Save the file in the same folder as the update sets."],"links":[{"label":"Our software models","path":"cmdb_software_product_model_list.do?sysparm_query=short_descriptionSTARTSWITHNorthstar"},{"label":"Our entitlements","path":"alm_license_list.do?sysparm_query=asset_tagSTARTSWITHNSM-ENT%5EORDERBYasset_tag"},{"label":"Our reclamation rule","path":"samp_sw_reclamation_rule_list.do?sysparm_query=nameSTARTSWITHNorthstar"}],"see":"3 more XML files: 5 software models, 5 entitlements and 1 rule."},{"id":"s6-8","num":"6.9","title":"Pack the backup for the repository","where":"This guide","what":"Packs the 9 files with a list and checksums, so anyone can see later that the backup is complete and unchanged.","do":["Click **Open Backup pack** below.","Drop all 9 XML files onto it and click **Download backup pack**.","Unzip it into the repository folder. It creates exports/release_01 with the files, a manifest and checksums.","Upload that folder to GitHub together with the end-of-session pack."],"links":[{"label":"Open Backup pack","view":"backup"}],"see":"exports/release_01 contains the XML files, MANIFEST.md and SHA256SUMS.","shot":"S6_04_backup_pack.png"}],"checks":[{"id":"s6-c1","text":"The dashboard answers the management questions."},{"id":"s6-c2","text":"Every visitor test passed, and the visitor is inactive again."},{"id":"s6-c3","text":"The 6 update sets are Complete and exported."},{"id":"s6-c4","text":"exports/release_01 with manifest and checksums is in the repository."}],"problems":[{"problem":"No Export to XML link on an update set","fix":"Set its State to Complete and click Update first."},{"problem":"A chart shows no data","fix":"Check the table and filter. License positions need a finished license check (step 4.9)."},{"problem":"The visitor cannot see the dashboard","fix":"Share it: open the dashboard, open its sharing settings and add the visitor or the sam_user role."}]},{"id":"s7","number":7,"title":"Finish the case study and present","short":"Case study and demo","time":"1.5 to 2 hours","goal":"Complete the case study with your real numbers, run the final checks, switch on the visitor login and rehearse the five-minute demo.","why":"The [[case study]] is what managers and interviewers read. Every claim in it must point to [[evidence]] or a live screen.","before":["Stage 6 is finished: dashboard, visitor tests and backup are done."],"steps":[{"id":"s7-1","num":"7.1","title":"Copy your numbers into the case study","where":"This guide","what":"Puts the real results from the sandbox into the case study, so every number in it is one you measured.","do":["Click **Open Session report** below and click **Copy results table**.","In the repository open docs/case_study.md and replace the **Headline results** table with it.","Fill each section marked 'filled in Stage N' with two or three sentences of what you did and saw."],"links":[{"label":"Open Session report","view":"report"}],"see":"The case study shows your real numbers, and every claim links to a screenshot."},{"id":"s7-2","num":"7.2","title":"Run the acceptance checklist","where":"This guide","what":"Checks the whole project against 19 acceptance points before anyone outside the team sees it.","do":["Go through each line and choose the result.","Fix what fails before you continue, or write an accepted exception in tracker/decisions.md."],"grid":{"id":"acceptance","rowLabel":"Check","summary":true,"columns":[{"key":"stage","label":"Stage","fixed":true},{"key":"result","label":"Result","type":"select","options":["Pass","Fail","Accepted exception"]}],"rows":[{"id":"a1","label":"Instance release recorded","stage":"0"},{"id":"a2","label":"SAM Professional plugins recorded","stage":"1"},{"id":"a3","label":"Workspace opens, or the fallback is documented","stage":"1"},{"id":"a4","label":"Content Service limit documented","stage":"1"},{"id":"a5","label":"60 users, 57 computers, 248 installations with discovery models","stage":"2"},{"id":"a6","label":"Normalization before and after recorded, 8 of 8 clean","stage":"3"},{"id":"a7","label":"5 software models, each with a matching discovery model","stage":"3"},{"id":"a8","label":"5 entitlements In use, with metric, cost and asset tag","stage":"4"},{"id":"a9","label":"Compliant, under- and over-licensed results recorded with screenshots","stage":"4"},{"id":"a10","label":"SQL Server result traced to the servers","stage":"4"},{"id":"a11","label":"Per core rule explained","stage":"5"},{"id":"a12","label":"Removal candidates and savings shown","stage":"5"},{"id":"a13","label":"Dashboard answers the management questions","stage":"6"},{"id":"a14","label":"Visitor tests passed","stage":"6"},{"id":"a15","label":"Backup pack in exports/release_01 verified","stage":"6"},{"id":"a16","label":"Repository checks green on GitHub (Actions tab)","stage":"7"},{"id":"a17","label":"Every claim in README and case study points to evidence","stage":"7"},{"id":"a18","label":"Recovery test answered all six questions","stage":"7"},{"id":"a19","label":"Demo rehearsed in five minutes","stage":"7"}]},"see":"Every line is Pass, or an exception written in tracker/decisions.md."},{"id":"s7-3","num":"7.3","title":"Switch on the visitor","where":"Your instance","what":"Opens the live system to reviewers, read-only.","do":["Click **Visitor user** below, open **portfolio.visitor**, tick **Active** and click **Update**.","In a private window sign in as the visitor and repeat four tests: open the workspace (opens), change an entitlement (refused), open Scripts - Background (refused), delete a record (refused).","In the README section **See it live**, add the instance address and the user name **portfolio.visitor**. Never write the password there.","Give the password only to the people who review the project, for example in a direct message."],"links":[{"label":"Visitor user","path":"sys_user_list.do?sysparm_query=user_name%3Dportfolio.visitor"}],"see":"Reviewers can sign in and look around, and nothing can be changed."},{"id":"s7-4","num":"7.4","title":"Run the paper recovery test","where":"GitHub","what":"Proves that someone outside the team could rebuild the project from the repository alone.","do":["Ask someone who did not build the project to read docs/10_recovery_plan.md.","Ask them six questions: which release, which activation, which files restore our changes, which data, in which order, and how we know it worked.","Improve the document wherever they got stuck."],"see":"They answer all six questions from the repository alone."},{"id":"s7-5","num":"7.5","title":"Rehearse the five-minute demo","where":"This guide","timer":true,"what":"Practises the story you tell managers and interviewers, one minute per part.","do":["Click **Start timer** and give the demo using the table.","Practise twice. Stop at five minutes."],"table":{"columns":[{"key":"minute","label":"Minute"},{"key":"show","label":"Show"},{"key":"say","label":"Say"}],"rows":[{"minute":"1","show":"README on GitHub","say":"Northstar, the sandbox, invented data, five stories. Everything can be rebuilt from this repository."},{"minute":"2","show":"Workspace, installations, one discovery model","say":"Raw names come in messy. We cleaned 8 of 8, so the license check can trust the data."},{"minute":"3","show":"SQL Server result and its servers","say":"16 cores owned, 24 needed: EUR 15,780 audit exposure, traced to three servers. Visio next to it: 25 licenses unused."},{"minute":"4","show":"Reclamation rule and removal candidates","say":"12 Project installations unused for 90 days: EUR 12,708 we can reuse instead of buying."},{"minute":"5","show":"Dashboard, visitor login, tracker, backup","say":"One screen for managers, a read-only login for reviewers, a tracked history and a tested backup."}]},"see":"The demo fits in five minutes."},{"id":"s7-6","num":"7.6","title":"Publish the release","where":"GitHub","what":"Freezes the finished project as version 1.0.0, so everyone refers to the same state.","do":["On the repository page on GitHub, click **Releases**, then **Draft a new release**.","Click **Choose a tag**, type **v1.0.0** and choose **Create new tag**.","Type the title **SAM Professional case study** and click **Publish release**."],"copy":[{"label":"Tag","value":"v1.0.0"},{"label":"Title","value":"SAM Professional case study"}],"see":"Release v1.0.0 is listed on the repository page."},{"id":"s7-7","num":"7.7","title":"Present it","where":"GitHub","what":"Gets the case study in front of the people it is for.","do":["Send the README link to your manager and book the demo.","Before every demo: sign in to the Developer Site 30 minutes early to wake the sandbox, and test the visitor login."],"see":"The demo is booked."}],"checks":[{"id":"s7-c1","text":"The case study has real numbers and evidence links."},{"id":"s7-c2","text":"The acceptance checklist passed, or exceptions are documented."},{"id":"s7-c3","text":"The visitor is active and retested."},{"id":"s7-c4","text":"Release v1.0.0 is published."}],"problems":[{"problem":"A number in the case study has no screenshot","fix":"Open the step that produced it in this guide, take the screenshot named there and add it to evidence/."},{"problem":"The sandbox was deleted before the demo","fix":"Follow docs/10_recovery_plan.md. Stages 1 to 6 take about one working day with the scripts and the backup pack."}]}]}</script>

le) {\n    var fields = [];\n    var gr = new GlideRecord(table);\n    gr.initialize();\n    var list = gr.getFields();\n    for (var i = 0; i < list.size(); i++) {\n      var el = list.get(i);\n      var ref = '';\n      try { ref = String(el.getReferenceTable() || ''); } catch (e) { ref = ''; }\n      fields.push({ name: String(el.getName()), ref: ref });\n    }\n    return fields;\n  }\n  function pick(fields, names, refTest) {\n    var i, j;\n    for (i = 0; i < names.length; i++) {\n      for (j = 0; j < fields.length; j++) {\n        if (fields[j].name === names[i] && (!refTest || refTest(fields[j].ref))) return fields[j];\n      }\n    }\n    if (refTest) {\n      for (j = 0; j < fields.length; j++) {\n        if (fields[j].ref && refTest(fields[j].ref)) return fields[j];\n      }\n    }\n    return null;\n  }\n  function find(table, field, value) {\n    var gr = new GlideRecord(table);\n    gr.addQuery(field, value);\n    gr.setLimit(1);\n    gr.query();\n    return gr.next() ? String(gr.getUniqueValue()) : '';\n  }\n  function newest(field, operator, value) {\n    var gr = new GlideRecord('alm_license');\n    if (field.indexOf('.') === -1 && !gr.isValidField(field)) return null;\n    gr.addQuery(field, operator, value);\n    gr.orderByDesc('sys_created_on');\n    gr.setLimit(1);\n    gr.query();\n    return gr.next() ? gr : null;\n  }\n  // Finds the entitlement by asset tag, then by invoice number, then by product name.\n  function findEntitlement(tag, info) {\n    var gr = newest('asset_tag', '=', tag);\n    var how = 'asset tag ' + tag;\n    if (!gr && info.invoice) {\n      gr = newest('invoice_number', '=', info.invoice);\n      how = 'invoice number ' + info.invoice;\n      if (gr) warn('No entitlement with asset tag ' + tag + '. Used the one with invoice number ' + info.invoice + '. Put ' + tag + ' in its Asset tag field.');\n    }\n    if (!gr) {\n      var probe = new GlideRecord('alm_license');\n      gr = newest(probe.isValidField('software_model     const ch = text[i];
    if (quoted) {
      if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (ch === '"') quoted = false;
      else cell += ch;
    } else if (ch === '"') quoted = true;
    else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (ch !== '\r') cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

/* ------------------------------------------------------------------ state */
function blankState() {
  return {
    app: APP_ID, version: 1, createdAt: nowIso(), updatedAt: null,
    steps: {}, checks: {}, records: {}, grids: {}, timers: {}, blocked: {}, sessions: [], draft: null,
    ui: { theme: 'system', open: {} },

}
let storageOk = true;
function loadState() {
  let raw = null;
  try { raw = window.localStorage.getItem(STORE_KEY); } catch (e) { storageOk = false; }
  if (!raw) return blankState();
  try { return mergeState(JSON.parse(raw)); } catch (e) { return blankState(); }
}
function mergeState(data) {
  const base = blankState();
  if (!data || typeof data !== 'object') return base;
  ['steps', 'checks', 'records', 'grids', 'timers', 'blocked'].forEach(k => { if (data[k] && typeof data[k] === 'object') base[k] = data[k]; });
  if (Array.isArray(data.sessions)) base.sessions = data.sessions;
  if (data.draft && typeof data.draft === 'object') base.draft = data.draft;
  if (data.ui && typeof data.ui === 'object') base.ui = Object.assign(base.ui, data.ui, { open: data.ui.open || {} });
  base.createdAt = data.createdAt || base.createdAt;
  base.updatedAt = data.updatedAt || null;
  return base;
}

function save() {
  state.updatedAt = nowIso();

}

/* ------------------------------------------------------------------ derived */
const isDone = id => !!(state.steps[id] && state.steps[id].done);
const isChecked = id => !!(state.checks[id] && state.checks[id].done);
function stageProgress(stage) {
  const required = stage.steps.filter(s => !s.optional);
  const checks = stage.checks || [];
  const stepsDone = required.filter(s => isDone(s.id)).length;
  const checksDone = checks.filter(c => isChecked(c.id)).length;
  const total = required.length + checks.length;
  const done = stepsDone + checksDone;
  const activity = done > 0 || stage.steps.some(s => isDone(s.id));
  const blocked = !!(state.blocked[stage.id] && state.blocked[stage.id].on);
  let status = 'todo';
  if (total > 0 && done === total) status = 'done';
  else if (blocked) status = 'blocked';
  else if (activity) status = 'progress';
  const times = stage.steps.map(s => state.steps[s.id]).concat(checks.map(c => state.checks[c.id]))
    .filter(x => x && x.done && x.at).map(x => x.at).sort();
  return {
    stepsDone, stepsTotal: required.length, checksDone, checksTotal: checks.length, done, total,
    pct: total ? Math.round(done * 100 / total) : 0, status,
    startedAt: times[0] || null, finishedAt: status === 'done' ? times[times.length - 1] : null,
  };
}
function overall() {
  let done = 0, total = 0;
  STAGES.forEach(st => { const p = stageProgress(st); done += p.done; total += p.total; });
  return { done, total, pct: total ? Math.round(done * 100 / total) : 0 };
}
function nextTask() {
  for (const stage of STAGES) {
    const p = stageProgress(stage);
    if (p.status === 'done') continue;
    const step = stage.steps.find(s => !s.optional && !isDone(s.id));
    return { stage, step: step || null };
  }
  return null;
}
const STATUS_LABEL = { done: 'Done', progress: 'In progress', blocked: 'Blocked', todo: 'Not started' };
const STATUS_MARK = { done: '🟢', progress: '🟡', blocked: '🔴', todo: '⚪' };

function instanceBase() {
  const raw = String(state.records.instance_url || '').trim();
  if (!raw) return '';

    const url = new URL(/^https?:\/\//i.test(raw) ? raw : 'https://' + raw);

}
function navHint(path) {

    stage.steps.forEach(step => { const s = state.steps[step.id]; if (s && s.done && inRange(s.at)) items.push({ kind: 'step', id: step.id, at: s.at }); });

/* ------------------------------------------------------------------ downloads, clipboard, toast, modal */
function download(name, data, type) {
  const blob = data instanceof Blob ? data : new Blob([data], { type: type || 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
let toastTimer = null;
function toast(message) {
  const el = $('#toast');
  el.textContent = message; el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
}
function closeModal() { $('#modal-root').innerHTML = ''; }
function openModal(html) {
  $('#modal-root').innerHTML = `<div class="modal-back" data-action="modal-close-back"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const focusable = $('#modal-root textarea, #modal-root input, #modal-root button');
  if (focusable) focusable.focus();
}
function manualCopy(text, title) {
  openModal(`<div class="row" style="justify-content:space-between"><h2>${esc(title || 'Copy this text')}</h2><button type="button" class="icon-btn" data-action="modal-close" aria-label="Close">${icon('x')}</button></div>
    <p class="muted">Your browser blocked automatic copying. The text is selected: press Ctrl+C (Cmd+C on a Mac), then close this box.</p>
    <textarea id="manual-copy" readonly>${esc(text)}</textarea>`);
  const ta = $('#manual-copy'); ta.focus(); ta.select();
}
async function copyText(text, label) {
  try {
    if (navigator.clipboard && window.isSecureContext !== false) {
      await navigator.clipboard.writeText(text);
      toast(`Copied${label ? ': ' + label : ''}`);
      return;
    }
  } catch (e) { /* fall through */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    if (ok) { toast(`Copied${label ? ': ' + label : ''}`); return; }
  } catch (e) { /* fall through */ }
  manualCopy(text, label);
}

function rerenderStep(stepId) {
  const { step, stage } = STEP_INDEX[stepId];
  const nextStep = stage.steps.find(s => !s.optional && !isDone(s.id));
  stage.steps.forEach(s => {
    const el = document.getElementById('step-' + s.id);

  pop.hidden = false;
  const r = btn.getBoundingClientRect();
  const w = pop.offsetWidth; const h = pop.offsetHeight;
  let left = Math.min(Math.max(16, r.left), window.innerWidth - w - 16);
  let top = r.bottom + 8;
  if (top + h > window.innerHeight - 16) top = Math.max(16, r.top - h - 8);
  pop.style.left = left + 'px'; pop.style.top = top + 'px';
}
const hidePopover = () => { $('#popover').hidden = true; };

/* ------------------------------------------------------------------ actions */
async function addBackupFiles(fileList) {
  const list = Array.from(fileList || []);
  for (const file of list) {
    const bytes = new Uint8Array(await file.arrayBuffer());
    const safe = file.name.replace(/[\\/:*?"<>|]+/g, '_');
    backupFiles = backupFiles.filter(f => f.name !== safe);
    backupFiles.push({ name: safe, bytes, hash: null });
  }
  if (currentView === 'backup') render();
  for (const f of backupFiles) { if (!f.hash) f.hash = await sha256Hex(f.bytes); }
  if (currentView === 'backup') render();
}
async function downloadBackup() {
  const folder = String(state.records._backup_folder || 'release_01').trim().replace(/[^A-Za-z0-9_.-]+/g, '_') || 'release_01';
  const notes = state.records._backup_notes || '';
  const enc = new TextEncoder();
  const rows = backupFiles.map(f => `| ${mdCell(f.name)} | ${f.bytes.length} | \`${f.hash}\` |`).join('\n');
  const manifest = [
    `# ${folder} manifest`, '',
    `Created: ${localDate()}  `,
    `Instance release and build: ${state.records.build_name || 'not recorded'} ${state.records.build_tag || ''}  `,
    `Created with: SAM Pro Build Guide ${C.meta.version}`, '',
    '## Contents', '', '| File | Bytes | SHA-256 |', '| --- | --- | --- |', rows, '',
    '## Restore sequence', '',
    '1. Request a Zurich instance and activate SAM Professional with demo data (guide Stages 0 and 1).',
    '2. Import each update set: All, Retrieved Update Sets, Import Update Set from XML; then Preview and Commit, in S1 to S6 order.',
    `3. Run the Northstar loader script (guide Stage 2, ${stepNo('s2-3')}).`,
    `4. Clean the 8 software names again (guide Stage 3, ${stepNo('s3-2')} to ${stepNo('s3-5')}). Cleaned names are data and are not in this backup.`,
    '5. Import the record exports (software models, entitlements, reclamation rule): open the list, right-click a column heading, Import XML.',
    '6. Check that the five entitlements are In use, run the allocation and usage scripts, run the license check (guide Stages 4 and 5).',
    '7. Recreate the visitor and repeat the visitor tests (guide Stage 6).', '',
    '## Notes', '', notes || 'None.', '',
  ].join('\n');
  const manifestBytes = enc.encode(manifest);
  const manifestHash = await sha256Hex(manifestBytes);
  const sums = backupFiles.map(f => `${f.hash}  ${f.name}`).concat([`${manifestHash}  MANIFEST.md`]).join('\n') + '\n';
  const entries = backupFiles.map(f => ({ name: `exports/${folder}/${f.name}`, data: f.bytes }))
    .concat([{ name: `exports/${folder}/MANIFEST.md`, data: manifestBytes }, { name: `exports/${folder}/SHA256SUMS`, data: sums }]);
  download(`backup_pack_${folder}_${localDate()}.zip`, makeZip(entries));
  toast(`Backup pack downloaded with ${backupFiles.length} files`);
}
function downloadPack() {
  const sess = commitDraft();
  const entries = [
    { name: 'tracker/TRACKER.md', data: trackerMd() },
    { name: 'tracker/tasks.csv', data: tasksCsv() },
    { name: 'tracker/progress.json', data: progressJson() },
    { name: `tracker/sessions/${sessionFileName(sess)}`, data: sessionMd(sess) },
  ];
  download(`end_of_session_pack_${sess.date}_session-${pad2(sess.n)}.zip`, makeZip(entries));
  toast(`Session ${sess.n} saved and the pack downloaded`);
  render();
}
function loadProgressFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(String(reader.result));
      if (data.app !== APP_ID) throw new Error('not a progress file');
      const theme = state.ui.theme;
      state = mergeState(data);
      state.ui.theme = theme;
      save(); applyTheme(); render();
      const o = overall();
      toast(`Progress loaded: ${o.done} of ${o.total} tasks done`);
    } catch (e) {
      toast('That file is not a progress file from this guide.');
    }
  };
  reader.readAsText(file);
}
const ACTIONS = {
  'open-nav': () => document.body.classList.add('nav-open'),
  'close-nav': () => document.body.classList.remove('nav-open'),
  theme: () => {
    const order = ['system', 'light', 'dark'];
    state.ui.theme = order[(order.indexOf(state.ui.theme || 'system') + 1) % order.length];
    applyTheme(); renderTop(); save();
    toast(`Theme: ${state.ui.theme}`);
  },
  copy: el => copyText(el.dataset.copy, el.dataset.copy.length > 40 ? '' : el.dataset.copy),
  'copy-script': el => copyText(SCRIPTS[el.dataset.script], el.dataset.script),
  'download-script': el => download(el.dataset.script, SCRIPTS[el.dataset.script], 'text/javascript;charset=utf-8'),
  'download-file': el => download(el.dataset.file, FILES[el.dataset.file], el.dataset.file.endsWith('.csv') ? 'text/csv;charset=utf-8' : 'text/markdown;charset=utf-8'),
  'download-all-files': () => {
    download('northstar_files.zip', makeZip(Object.keys(FILES).map(n => ({ name: 'northstar/' + n, data: FILES[n] }))));
    toast('Northstar files downloaded');
  },
  'toggle-step': el => {
    const id = el.dataset.stepId;
    const card = document.getElementById('step-' + id);
    const collapsed = card.classList.toggle('is-collapsed');
    el.setAttribute('aria-expanded', String(!collapsed));
    if (isDone(id)) { state.ui.open[id] = !collapsed; save(); }
  },
  'timer-start': el => { state.timers[el.dataset.stepId] = { start: nowIso(), stop: null }; save(); rerenderStep(el.dataset.stepId); },
  'timer-stop': el => { const t = state.timers[el.dataset.stepId]; if (t) t.stop = nowIso(); save(); rerenderStep(el.dataset.stepId); },
  print: () => window.print(),
  'download-pack': () => downloadPack(),
  'copy-report': () => copyText(sessionMd(draftSession()), 'session report'),
  'copy-results': () => copyText(resultsMd(), 'results table'),
  'new-session': () => {
    const d = ensureDraft();
    const n = Math.max(nextSessionNumber(), d.n + 1);
    const nt = nextTask();
    state.draft = { n, date: localDate(), people: d.people || '', notes: '', blockers: '', next: nt ? (nt.step ? `Stage ${nt.stage.number}, step ${nt.step.num}: ${plain(nt.step.title)}` : `Stage ${nt.stage.number}: finish the checks`) : '' };
    save(); render(); toast(`Session ${n} started`);
  },
  'save-progress': () => { download(`sam_guide_progress_${localDate()}.json`, progressJson(), 'application/json'); toast('Progress file saved'); },
  reset: () => {
    const v = ($('#reset-confirm') || {}).value;
    if (String(v).trim().toUpperCase() !== 'RESET') { toast('Type RESET in the box first.'); return; }
    const theme = state.ui.theme;
    state = blankState(); state.ui.theme = theme; save(); render();
    toast('All progress cleared in this browser');
  },
  'clear-backup': () => { backupFiles = []; render(); },
  'download-backup': el => { if (!el.disabled) downloadBackup(); },
  'modal-close': () => closeModal(),
  'modal-close-back': (el, ev) => { if (ev.target === el) closeModal(); },
};

document.addEventListener('click', ev => {
  const term = ev.target.closest('.term');
  if (term) { ev.preventDefault(); showTerm(term); return; }
  if (!ev.target.closest('#popover')) hidePopover();
  const focusLink = ev.target.closest('[data-focus-step]');
  if (focusLink && focusLink.dataset.focusStep) pendingFocus = focusLink.dataset.focusStep;
  const el = ev.target.closest('[data-action]');
  if (el && ACTIONS[el.dataset.action]) {
    if (el.tagName === 'A') ev.preventDefault();
    ACTIONS[el.dataset.action](el, ev);
  }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.stepCheck) {
    const id = t.dataset.stepCheck;
    if (t.checked) state.steps[id] = { done: true, at: nowIso() }; else delete state.steps[id];
    delete state.ui.open[id];
    save();
    const step = rerenderStep(id);
    if (t.checked) {
      toast(`Step ${step.num} done`);
      const { stage } = STEP_INDEX[id];
      const next = stage.steps.find(s => !s.optional && !isDone(s.id));
      const nextEl = next && document.getElementById('step-' + next.id);
      if (nextEl) nextEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    return;
  }
  if (t.dataset.check) {
    const id = t.dataset.check;
    if (t.checked) state.checks[id] = { done: true, at: nowIso() }; else delete state.checks[id];
    save();
    t.closest('.check').classList.toggle('done', t.checked);
    refreshProgressBits();
    const { stage } = CHECK_INDEX[id];
    if (stageProgress(stage).status === 'done') toast(`Stage ${stage.number} complete. Write the session report, or carry on with Stage ${stage.number + 1}.`);
    return;
  }
  if (t.dataset.blocked) {
    const id = t.dataset.blocked;
    state.blocked[id] = Object.assign({}, state.blocked[id], { on: t.checked, at: nowIso() });
    save(); refreshProgressBits();
    return;
  }
  if (t.dataset.record === 'instance_url') { refreshLinks(); return; }
  if (t.id === 'backup-input') { addBackupFiles(t.files); t.value = ''; return; }
  if (t.id === 'load-input') { if (t.files[0]) loadProgressFile(t.files[0]); t.value = ''; return; }
  if (t.dataset.grid) handleGrid(t);
});
function handleGrid(t) {
  const g = state.grids[t.dataset.grid] = state.grids[t.dataset.grid] || {};
  const row = g[t.dataset.row] = g[t.dataset.row] || {};
  row[t.dataset.col] = t.type === 'checkbox' ? (t.checked ? 'yes' : '') : t.value;
  save();
  const rate = document.querySelector(`[data-rate="${t.dataset.grid}"]`);
  if (rate) rate.innerHTML = rateText(GRID_INDEX[t.dataset.grid].grid);
}
let previewTimer = null;
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.record) {
    state.records[t.dataset.record] = t.value; save();
    if (t.dataset.record === 'instance_url') { const h = $('#instance-hint'); if (h) h.innerHTML = instanceHint(); refreshLinks(); }
    return;
  }
  if (t.dataset.grid && t.type !== 'checkbox' && t.tagName !== 'SELECT') { handleGrid(t); return; }
  if (t.dataset.draft) {
    ensureDraft(); state.draft[t.dataset.draft] = t.value; save();
    clearTimeout(previewTimer);
    previewTimer = setTimeout(() => { const p = $('#report-preview'); if (p) p.textContent = sessionMd(draftSession()); }, 250);
    return;
  }
  if (t.dataset.blockedReason) {
    const id = t.dataset.blockedReason;
    state.blocked[id] = Object.assign({ on: false }, state.blocked[id], { reason: t.value });
    save(); return;
  }
  if (t.dataset.backupFolder !== undefined) { state.records._backup_folder = t.value; save(); return; }
  if (t.dataset.backupNotes !== undefined) { state.records._backup_notes = t.value; save(); return; }
  if (t.id === 'glossary-search') {
    const q = t.value.trim().toLowerCase();
    $$('#glossary-list [data-g]').forEach(el => {
      const term = el.dataset.g;
      const text = el.tagName === 'DD' ? el.textContent.toLowerCase() : term;
      const pairHit = term.includes(q) || (el.tagName === 'DT' ? (el.nextElementSibling.textContent.toLowerCase().includes(q)) : text.includes(q));
      el.hidden = q && !pairHit;
    });
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { hidePopover(); closeModal(); document.body.classList.remove('nav-open'); }
});
document.addEventListener('dragover', ev => {
  const dz = ev.target.closest && ev.target.closest('#dropzone');
  if (dz) { ev.preventDefault(); dz.classList.add('over'); }
});
document.addEventListener('dragleave', ev => {
  const dz = ev.target.closest && ev.target.closest('#dropzone');
  if (dz) dz.classList.remove('over');
});
document.addEventListener('drop', ev => {
  const dz = ev.target.closest && ev.target.closest('#dropzone');
  if (dz) { ev.preventDefault(); dz.classList.remove('over'); addBackupFiles(ev.dataTransfer.files); }
});
window.addEventListener('hashchange', render);
window.addEventListener('resize', hidePopover);
setInterval(() => {
  $$('[data-clock]').forEach(el => { const t = state.timers[el.dataset.clock]; if (t && t.start && !t.stop) el.textContent = elapsedText(t); });
}, 500);

applyTheme();
render();
window.__samGuide = { trackerMd, tasksCsv, progressJson, sessionMd, resultsMd, makeZip, sha256Hex, sha256Fallback, state: () => state };
})();
</script>

<script type="application/json" id="guide-content">{"meta":{"title":"SAM Pro Build Guide","subtitle":"Build ServiceNow Software Asset Management Professional on a free Zurich sandbox, one stage at a time.","version":"1.1","updated":"2026-10-15","release":"Zurich","company":"Northstar Manufacturing"},"rules":["Only fake data. Never type real names, license keys, contracts or company data into the sandbox.","Never type a password into this guide. It saves what you type in this browser.","The sandbox owner signs in to developer.servicenow.com at least once a week. A sandbox nobody uses for 10 days is deleted.","Tick a step only when you see what **You should see** describes.","End every session with the end-of-session pack. It takes two minutes and keeps the tracker current."],"routine":{"start":["Open this guide. On a new computer or browser, load **tracker/progress.json** from the repository (Progress page).","Sign in to the Developer Site and wake the sandbox if it is asleep.","Click **Continue** on the Welcome page. It opens the next step."],"during":["Follow the steps in order and tick each one when its result matches.","Take the screenshots the steps name and save them with exactly those file names.","Write down what the step asks for in its boxes. These notes go into the tracker."],"end":["Open **Session report**, fill in who took part and anything that blocked you.","Click **Download end-of-session pack** and unzip it into the repository folder.","Upload the changed files and new screenshots to GitHub."]},"basics":{"intro":["Companies install software on hundreds of computers. Every program comes with license terms that say how many people, computers or processor cores may use it.","Use more than you bought and the vendor can send a bill after an audit. Buy more than you use and money is wasted. Software Asset Management (SAM) keeps the two in balance."],"questions":[{"q":"What do we have?","a":"Every program found on every computer, with a clean, standard name."},{"q":"What may we use?","a":"Every purchase, with the rules of its license."},{"q":"Do they match, and what does it cost?","a":"Where we are short (an audit risk), where we pay for unused licenses (waste) and what to do about it."}],"chain":[{"name":"Installation","plain":"A scan finds a program on a computer. One record per program per computer.","stage":2},{"name":"Discovery model","plain":"All installations with the same publisher, name and version are grouped into one discovery model.","stage":2},{"name":"Normalization","plain":"Messy names are cleaned into one standard name, such as Microsoft Visio Professional 2021.","stage":3},{"name":"Software model","plain":"The product as we manage it for licensing. It collects the matching installations.","stage":3},{"name":"Entitlement","plain":"What we bought: product, quantity, license metric and price.","stage":4},{"name":"Reconciliation","plain":"The license check. It compares what is installed and assigned with what was bought.","stage":4},{"name":"Reclamation","plain":"Taking back licenses that nobody uses, so they can be reused instead of bought again.","stage":5}],"outcomes":[{"name":"Compliant","plain":"We own at least what we use. Nothing to do.","tone":"good"},{"name":"Under-licensed","plain":"We use more than we own. An audit could cost money.","tone":"bad"},{"name":"Over-licensed","plain":"We own more than we use. Money is tied up in unused licenses.","tone":"warn"}]},"moves":{"intro":"Six moves cover almost everything this guide asks you to do in ServiceNow. Learn them once in step 1.2; come back here whenever a step feels unclear.","moves":[{"title":"1. Find a page with the All menu","how":["Click **All** at the top left.","Type a few letters in the filter box, for example **update sets**.","Click the matching item in the results."],"tip":"Type a list name such as **cmdb_ci_computer.list** and press Enter to open that list directly."},{"title":"2. Open a page from this guide","how":["Click a green **Open** button in a step. It opens the exact list or form in a new tab, already filtered to Northstar records.","The buttons need the instance address from step 0.5. Without it they show a name to copy into the All menu instead."],"tip":"Leave the guide open in one browser tab and the instance in another."},{"title":"3. Read a list","how":["One row is one record.","The count is at the bottom right, for example **1 to 20 of 248**: 248 rows in total.","Click a column heading to sort by it."],"tip":"A column you need is missing: right-click a column heading, choose **Configure**, **List Layout**, move the field to the right side and click **Save**."},{"title":"4. Filter or group a list","how":["Filter: click the funnel icon at the top left of the list. Choose a field, a condition and a value, and click **Run**.","Group: right-click a column heading and choose **Group By**.","Undo both: click **All** in the grey line above the list."],"tip":"The grey line above the list always shows which filter is active."},{"title":"5. Open and fill in a record","how":["Click the blue text in the first column to open a record. Its form opens.","A red star marks a required field.","A field with a magnifier icon points to another record: type the first letters and pick from the list that appears.","A small **(i)** button next to such a field shows that record; click **Open Record** to go there.","Tabs below the fields (such as **General** or **Financial**) and lists at the bottom (such as **Roles**) hold more fields and linked records."],"tip":"Grey fields cannot be changed. The system fills them in."},{"title":"6. Save, or leave without saving","how":["New record: **Submit** saves it and goes back to the list.","Existing record: **Update** saves it and goes back.","Save and stay on the form: right-click the grey header bar of the form and choose **Save**.","Leave without saving: click the back arrow at the top left of the form."],"tip":"In the Software Asset Workspace the buttons are simply called **Save**, and **Publish** for entitlements."}],"extras":[{"title":"Scripts - Background","text":"A page where an admin pastes a script and clicks **Run script**. This guide uses it for 5 scripts. Each script says at the top what it does, and none of them deletes anything."},{"title":"Elevate role","text":"Some pages need a temporary extra permission. Click your picture (top right), **Elevate role**, tick **security_admin** and click **Update**. It lasts until you sign out."},{"title":"Execute Now","text":"Scheduled jobs normally run at night or once a week. Open the job and click **Execute Now** to start it at once. It runs in the background; check its result in the list the step names."},{"title":"Update sets","text":"The globe icon in the top bar shows which update set records your changes. Each stage starts its own."}]},"stories":[{"scenario":"A","product":"Adobe Acrobat 2024 Pro","metric":"Per user","owned":"40","used":"40","position":"Compliant","money":"Subscription renewal on 31 Jan 2027 is tracked"},{"scenario":"B","product":"Microsoft SQL Server 2022 Standard","metric":"Per core","owned":"16 cores","used":"24 cores","position":"Under-licensed","money":"EUR 15,780 audit exposure (4 packs of 2 cores)"},{"scenario":"C","product":"Microsoft Visio 2021 Professional","metric":"Per device","owned":"60","used":"35","position":"Over-licensed","money":"EUR 14,475 of licenses to reuse before buying more"},{"scenario":"D","product":"Microsoft Project 2021 Professional","metric":"Per device","owned":"30","used":"28 (12 unused)","position":"Compliant","money":"EUR 12,708 can be reclaimed from 12 unused installations"},{"scenario":"E","product":"Microsoft Windows Server 2022 Standard","metric":"Per core","owned":"112 cores","used":"112 cores","position":"Compliant","money":"Shows Microsoft's minimum core rules at work"}],"glossary":[{"term":"Allocation","plain":"Assigning a license to a specific person or computer."},{"term":"Asset tag","plain":"A short label that identifies one record. Our five purchases are tagged NSM-ENT-A to NSM-ENT-E, so scripts, reports and backups can find them."},{"term":"Background script","plain":"A page (Scripts - Background) where an admin pastes a script and runs it once."},{"term":"Case study","plain":"The final document that tells the project story to managers and interviewers."},{"term":"Content library","plain":"ServiceNow's catalogue of known software products, used to recognise and clean names."},{"term":"Content Service","plain":"An online service that keeps the content library current on paid instances. A PDI does not have it."},{"term":"Demo data","plain":"Sample records ServiceNow can add when you switch on a product."},{"term":"Developer Site","plain":"developer.servicenow.com, the website where you get and manage your PDI and switch on paid products for it."},{"term":"Discovery map","plain":"The rule that connects found installations to a software model. On the model it shows as the tab Matching Discovery Models. A model without a match counts nothing."},{"term":"Discovery model","plain":"One record for each unique combination of publisher, program name and version found on computers."},{"term":"Elevate role","plain":"Switching on an extra admin permission, security_admin, for the current session. Some pages, such as Scripts - Background, need it."},{"term":"Entitlement","plain":"A record of what was bought: product, how many, license metric, price and dates."},{"term":"Evidence","plain":"Screenshots that prove a result. They go in the repository's evidence folder."},{"term":"Import set","plain":"ServiceNow's standard way to load a spreadsheet into a table, using a transform map."},{"term":"Installation","plain":"A record saying that a program is installed on a computer. Also called a software installation or install."},{"term":"Instance","plain":"One company's own copy of ServiceNow, reached at its own web address."},{"term":"License metric","plain":"What you count to know how many licenses you need: per user, per device or per processor core."},{"term":"License position","plain":"The result of the license check for one product: compliant, under-licensed or over-licensed."},{"term":"Normalization","plain":"Cleaning messy software names into one standard name, for example turning 'Microsoft Visio Professional 2021 x64' into Microsoft Visio 2021 Professional."},{"term":"Normalization status","plain":"How well a discovery model was cleaned: Normalized, Partially Normalized, Publisher Normalized, Match Not Found, Manually Normalized or New. Normalized and Manually Normalized count as clean."},{"term":"Northstar Manufacturing","plain":"Our invented company with 60 employees, 45 laptops and 12 servers."},{"term":"PDI","plain":"Personal Developer Instance. A free ServiceNow instance for learning. It is our sandbox."},{"term":"Per core licensing","plain":"Paying for each processor core of a server. Microsoft sets minimums per processor and per server."},{"term":"Plugin","plain":"A package of features that you switch on in an instance. SAM Professional is a set of plugins."},{"term":"Product type","plain":"Says whether software needs a license. Only software with product type Licensable is counted in the license check."},{"term":"Publish","plain":"The button that switches on an entitlement. It changes the State from Build to In use; the license check ignores entitlements in Build."},{"term":"Publisher pack","plain":"Extra licensing rules for one vendor, such as Microsoft or Oracle, included in SAM Professional."},{"term":"Reclamation","plain":"Taking back licenses that are not used so they can be reused."},{"term":"Reclamation rule","plain":"The condition that decides when installed software counts as unused, for example not used for three months."},{"term":"Reconciliation","plain":"The license check. It compares what is installed and allocated with what was bought."},{"term":"Release","plain":"A ServiceNow version. There are two a year: Zurich (2025), Australia (May 2026) and Brazil (late 2026)."},{"term":"Remediation","plain":"The options to fix a license problem, such as buying more licenses or removing installations."},{"term":"Removal candidate","plain":"An installation the system suggests removing because the reclamation rule found it unused."},{"term":"Role","plain":"A set of permissions given to a user, such as sam_admin or sam_user."},{"term":"SAM","plain":"Software Asset Management: knowing what software you have and what you may use, and keeping the two in balance at the lowest cost."},{"term":"SAM Professional","plain":"ServiceNow's paid SAM product. It cleans software names, calculates license positions and knows the rules of big vendors."},{"term":"Scheduled job","plain":"A task the system runs automatically at set times. You can also start one at once with Execute Now."},{"term":"ServiceNow","plain":"A cloud platform many companies use to run IT and business processes, such as requests, incidents and assets, in one system."},{"term":"snc_read_only","plain":"A platform role that stops a user from creating, changing or deleting anything."},{"term":"Software Asset Workspace","plain":"The modern screen in ServiceNow where SAM work is done."},{"term":"Software model","plain":"The product as we manage it for licensing, for example Microsoft Visio Professional. It collects the matching installations."},{"term":"Software usage","plain":"Records of when a program was last used and for how long, normally collected by an agent on each computer."},{"term":"Synthetic data","plain":"Invented data that looks realistic but describes no real person or company."},{"term":"True-up","plain":"Paying the vendor for use above what you bought, often after an audit."},{"term":"Unit cost","plain":"The price of one right: one user, one device or one processor core. ServiceNow multiplies it by the number of rights to show money."},{"term":"Update set","plain":"A container that records configuration changes so they can be exported as a backup or moved to another instance."}],"stages":[{"id":"s0","number":0,"title":"Get your ServiceNow sandbox","short":"Get the sandbox","time":"15 minutes, plus waiting time","goal":"Get a free personal ServiceNow instance on the Zurich release. Everything else in this project is built inside it.","why":"A [[PDI]] is a free sandbox from ServiceNow. Nothing we do in it can touch company systems.","before":["Choose the sandbox owner. Each developer account can have one instance, and the owner must sign in to the Developer Site at least once a week.","Have a password manager ready. The admin password goes there and nowhere else."],"steps":[{"id":"s0-1","num":"0.1","title":"Sign in to the ServiceNow Developer Site","where":"Developer Site","what":"Gets you into the [[Developer Site]], the free ServiceNow website where the sandbox is requested and managed.","do":["Click **Open the Developer Site** below. It opens developer.servicenow.com in a new tab.","Click **Sign In** at the top right.","Type your email address and click **Next**. Type your password and click **Sign In**.","No account yet: click **Sign Up** instead, fill in the form, open the email you receive and click its link. Then sign in."],"links":[{"label":"Open the Developer Site","url":"https://developer.servicenow.com"}],"see":"You are signed in. Your name or picture shows at the top right.","help":["The site shows an error or says it is busy: wait a few minutes and reload. The site had outages in 2026.","You forgot your password: click **Forgot password** on the sign-in page and follow the email."]},{"id":"s0-2","num":"0.2","title":"Check whether you already have an instance","where":"Developer Site","what":"Each account can have only one instance. This step checks whether you already have one, so you never delete it by accident.","do":["Look at the Developer Site home page. An existing instance shows as a card with its name (like dev123456) and its release.","Not on the home page: click your picture (top right) and look for **Manage instance** or **My instance**.","You have a **Zurich** instance: go straight to step 0.5.","You have an instance on another release and nothing in it matters to you: choose **Release instance** in its menu. Releasing deletes everything in it. Then go to step 0.3.","You have no instance: go to step 0.3."],"see":"You know whether you already have an instance, and on which release."},{"id":"s0-3","num":"0.3","title":"Request a Zurich instance","where":"Developer Site","what":"Asks ServiceNow for a free instance on Zurich, the release this guide is written for.","do":["Click **Request Instance** at the top right of the Developer Site.","In the list of releases, click **Zurich**. Do not choose Australia (newer) or Brazil (newest, still in early access).","Click **Request**.","Stay on the page. Most requests finish within a few minutes, and a box then shows the instance details. Go to step 0.5.","If the site says you are on a waitlist, stay on it and do step 0.4 while you wait. ServiceNow sends an email when the instance is ready.","Write the release and today's date in the box below."],"see":"A box with the instance address, the user name **admin** and a password, or a message that you are on the waitlist.","help":["\"We were unable to assign an instance to you\": sign out, go back to the Developer Site home page, sign in and try again.","On a waitlist: stay on it. Leaving and joining again puts you at the end. Waits of several days were common in 2026.","Zurich is not in the list: read **Zurich is not offered** under Troubleshooting below."],"record":[{"id":"release_requested","label":"Release requested, and on which date","placeholder":"Zurich, 15 Oct 2026"}]},{"id":"s0-4","num":"0.4","title":"While you wait: learn and prepare","where":"This guide","optional":true,"what":"Uses the waiting time to learn what SAM is and what we are going to build.","do":["Click **Basics in 5 minutes** in the menu on the left and read it.","Read files 01 to 05 in the repository's docs folder.","Open **Northstar files** in the Toolbox and look at the invented company we will build.","Come back when the email says your instance is ready."],"links":[{"label":"Open Basics","view":"basics"},{"label":"Open Northstar files","view":"files"}],"see":"You can explain the five stories in your own words."},{"id":"s0-5","num":"0.5","title":"Save the instance details","where":"Developer Site","what":"Keeps the sign-in details safe, and gives this guide the instance address so its **Open** buttons go straight to the right ServiceNow pages.","do":["On the Developer Site, find the instance details: **Instance URL** (like https://dev123456.service-now.com), **Username** (admin) and **Password**.","The details box is gone: click your picture (top right) and choose **Manage instance password**. The label can differ slightly.","Save the address, the user name **admin** and the password in your password manager. Never type the password into this guide, a chat or the repository.","Copy the instance address and paste it into **Instance address** below.","Type the initials of the sandbox owner below."],"record":[{"id":"instance_url","label":"Instance address","type":"url","placeholder":"https://dev123456.service-now.com","fact":true},{"id":"owner","label":"Sandbox owner (initials)","placeholder":"AB","fact":true}],"see":"The hint under the address says which address the Open buttons use, and the buttons in later steps say **Open**.","shot":"S0_01_developer_site_instance.png"},{"id":"s0-6","num":"0.6","title":"Sign in and check that it is Zurich","where":"Your instance","what":"Proves that the instance works and that it runs Zurich.","do":["Click **Open stats page** below. The ServiceNow sign-in page opens.","Type **admin** as user name and the password from your password manager. Click **Log in**.","If ServiceNow asks you to choose a new password, do it and update your password manager.","The stats page shows many technical lines. Find the line **Build name**.","Type what it says into **Build name** below."],"links":[{"label":"Open stats page","path":"stats.do"}],"see":"**Build name: Zurich**","help":["Another release: stop here. Release the instance and request Zurich (step 0.3), or follow **Zurich is not offered** under Troubleshooting.","The page says the instance is asleep: sign in to the Developer Site and wake it. Waking takes 3 to 5 minutes, at most 20."],"record":[{"id":"build_name","label":"Build name","placeholder":"Zurich","fact":true},{"id":"build_tag","label":"Build tag (optional)","placeholder":"glide-zurich-..."}],"shot":"S0_02_build_name_zurich.png"},{"id":"s0-7","num":"0.7","title":"Set the weekly reminder","where":"Calendar","what":"Keeps the sandbox alive. The Developer Site deletes an instance when its owner has not signed in for 10 days.","do":["Open the sandbox owner's calendar.","Create a meeting that repeats every week, for example every Monday at 09:00.","Paste the reminder text below as its title."],"copy":[{"label":"Reminder text","value":"Sign in to developer.servicenow.com (keeps the SAM sandbox alive)"}],"note":"Signing in to the Developer Site also wakes an instance that went to sleep.","see":"The weekly reminder is in the owner's calendar."}],"checks":[{"id":"s0-c1","text":"You can sign in to the instance as admin."},{"id":"s0-c2","text":"The stats page shows Build name Zurich, or the release rule was applied and written in tracker/decisions.md."},{"id":"s0-c3","text":"The admin password is only in a password manager."}],"problems":[{"problem":"Zurich is not offered","fix":"Join the Zurich waitlist once and wait up to 7 days. If no Zurich instance arrives, request Australia, write the decision in tracker/decisions.md and carry on. Never call an Australia instance Zurich."},{"problem":"The instance is asleep","fix":"Sign in to the Developer Site and use the wake button. It takes 3 to 5 minutes, at most 20."},{"problem":"Forgot the admin password","fix":"Developer Site, your picture (top right), Manage instance password. The label can differ slightly."},{"problem":"Still on the waitlist after many days","fix":"Keep your place. ServiceNow support does not handle PDIs. Use the time for the reading in step 0.4."}]},{"id":"s1","number":1,"title":"Switch on SAM Professional","short":"Switch on SAM Pro","time":"2 to 3 hours (the installation runs by itself for 1 to 2 hours)","goal":"Install Software Asset Management Professional with its sample data, check every part, open the Software Asset Workspace and write down how things look before we add our data.","why":"[[SAM Professional]] is a paid product. On a sandbox it can be switched on for free from the Developer Site. Checking each part now saves hours later.","before":["Stage 0 is finished: you can sign in to the Zurich instance.","The instance is awake: open it once before you start."],"steps":[{"id":"s1-2","num":"1.1","title":"Start the SAM Professional installation","where":"Developer Site","timer":true,"wait":"1 to 2 hours","what":"Switches on [[SAM Professional]] and its [[demo data]] in your instance. The Developer Site does the work; it runs by itself for 1 to 2 hours.","do":["Click **Open the Developer Site** below and check that you are signed in.","Click your picture (top right) and choose **Activate Plugin**. On some versions it is on the **Manage instance** page.","In the search box, type **Software Asset Management Professional**.","Click **Activate** next to it and choose the option **with demo data**. Confirm.","Click **Start timer** below. Do not change anything in the instance while it installs. Looking around is fine.","Write each attempt and its time in the box below."],"copy":[{"label":"Search text","value":"Software Asset Management Professional"}],"links":[{"label":"Open the Developer Site","url":"https://developer.servicenow.com"}],"see":"A message that the activation has started. Later the Developer Site shows it as complete, and you usually receive an email.","help":["It failed: try once more. Failed again: follow **Activation keeps failing** under Troubleshooting.","Only an option without demo data: use it. Our own data arrives in Stage 2.","Not in the list: search for **Software Asset** and write down what you see."],"record":[{"id":"activation_log","label":"Activation attempts, times and any error text","type":"textarea"}]},{"id":"s1-moves","num":"1.2","title":"Learn the six moves in ServiceNow","where":"Your instance","what":"Teaches the six moves you make on almost every ServiceNow page: find a page, open one from this guide, read a list, filter or group it, open a record, and save or leave it. It takes about 10 minutes and only looks, so it is safe while the installation runs.","do":["Open **Moving around ServiceNow** below. It explains the same six moves in a few lines. Keep it open next to the instance.","**Move 1, find a page.** In the instance click **All** (top left) and type **users**. Click **Users** in the results. The user list opens.","**Move 2, open a page from this guide.** Click the **Users** button below. The same list opens in a new tab. Close that tab again.","**Move 3, read a list.** Look at the bottom right of the list. It says something like **1 to 20 of 600**: 600 rows in total.","**Move 4, filter or group.** Right-click the column heading **Department** and choose **Group By Department**. Click **All** in the grey line above the list to undo it. Then click the funnel icon at the top left, choose **First name**, keep **is**, type **Abel** and click **Run**. One row remains: Abel Tuter.","**Move 5, open a record.** Click **Abel Tuter**. The user form opens. Look at the fields, then scroll down to the tabs at the bottom, such as **Roles**.","**Move 6, save or leave.** Do not save anything now. Click the back arrow at the top left of the form to leave without saving."],"links":[{"label":"Moving around ServiceNow","view":"moves"},{"label":"Users","path":"sys_user_list.do"}],"note":"Saving works in two ways: **Submit** saves a new record and **Update** saves a changed one; both take you back to the list. Moving around ServiceNow also explains how to save and stay on the form.","see":"You can find a page, read a count, group, filter, open a record and leave it without saving.","help":["No Abel Tuter: the demo users are missing. Try any other first name from the list."]},{"id":"s1-3","num":"1.3","title":"While it installs: read the basics","where":"This guide","optional":true,"what":"Uses the waiting time to learn the words the next stages use.","do":["Click **Basics in 5 minutes** in the menu on the left and read it.","Open **Northstar files** in the Toolbox and look at the people, computers and software we load in Stage 2."],"links":[{"label":"Open Basics","view":"basics"},{"label":"Open Northstar files","view":"files"}],"see":"You can explain installation, entitlement and reconciliation in one sentence each."},{"id":"s1-1","num":"1.4","title":"Start the change log for this stage","where":"Your instance","what":"Creates an [[update set]] for this stage. It records every setting we change, so Stage 6 can export it as a backup.","do":["Click **Update sets** below. The list **Local Update Sets** opens.","Click **New** at the top of the list. An empty update set form opens.","Fill in **Name** as shown in the table.","Click **Submit and Make Current**."],"form":[{"title":"Update set form","rows":[{"field":"Name","value":"SAM Portfolio S1 Foundation"}]}],"links":[{"label":"Update sets","path":"sys_update_set_list.do?sysparm_query=nameSTARTSWITHSAM%20Portfolio%5EORDERBYname"}],"see":"The list shows **SAM Portfolio S1 Foundation** with State **In progress**, and the globe icon in the top bar shows it as your current update set.","help":["There is only a **Submit** button: click it, click the new update set in the list, then click **Make This My Current Set**.","To check the current update set at any time, click the globe icon in the top bar. No globe icon: click your picture (top right), **Preferences**, **Developer**, and switch on **Show update set picker in header**."],"note":"Every stage from now on starts with its own update set. The data we load with scripts is not in update sets; the scripts in this guide can load it again at any time."},{"id":"s1-4","num":"1.5","title":"Check the installed parts","where":"Your instance","what":"Confirms that the installation finished and records exactly which SAM parts and versions we have.","do":["Wait until the Developer Site says the activation is complete. Then sign in to the instance again.","Click **Plugin list** below. It lists the [[plugin|plugins]] whose ID contains samp.","Check that they show as active.","Copy the **ID** and **Version** of each row into the box below, one per line."],"links":[{"label":"Plugin list","path":"v_plugin_list.do?sysparm_query=idLIKEsamp"}],"see":"Several active plugins, for example **com.snc.samp**.","help":["The list is empty or not filtered: in the search box above the list, choose **ID**, type ***samp** and press Enter."],"record":[{"id":"plugins","label":"Plugin IDs and versions","type":"textarea","fact":true}],"shot":"S1_01_plugins.png"},{"id":"s1-5","num":"1.6","title":"Check the SAM tables","where":"Your instance","what":"Makes sure the six main SAM lists exist and open without errors, and records how many sample rows they hold.","do":["Click each button below. Each opens one list in a new tab.","Each list must open without an error message.","For the first four lists, read the count at the bottom right (for example **1 to 20 of 1,240**) and type the total in the table."],"links":[{"label":"Software installations","path":"cmdb_sam_sw_install_list.do"},{"label":"Discovery models","path":"cmdb_sam_sw_discovery_model_list.do"},{"label":"Software models","path":"cmdb_software_product_model_list.do"},{"label":"Entitlements","path":"alm_license_list.do"},{"label":"Reconciliation runs","path":"samp_reconciliation_result_list.do"},{"label":"Software usage","path":"samp_sw_usage_list.do"}],"grid":{"id":"baseline_counts","rowLabel":"List","summary":true,"columns":[{"key":"rows","label":"Rows","type":"number"}],"rows":[{"id":"installs","label":"Software installations"},{"id":"dm","label":"Discovery models"},{"id":"models","label":"Software models"},{"id":"ents","label":"Entitlements"}]},"see":"Every list opens. With demo data the first four show rows. The last two may be empty.","help":["\"Invalid table\" on one of the first four: the installation is not finished or failed. Go back to step 1.1."],"shot":"S1_02_tables.png"},{"id":"s1-6","num":"1.7","title":"Check the SAM roles and automatic jobs","where":"Your instance","what":"Confirms the SAM permissions exist and finds the automatic jobs we start by hand in later stages.","do":["Click **Roles** below. Find **sam_user** and **sam_admin** in the list.","Click **Scheduled jobs** below. It lists the jobs whose name starts with SAM.","Find the jobs for normalization, reconciliation and reclamation candidates, and copy their names into the box below."],"links":[{"label":"Roles","path":"sys_user_role_list.do?sysparm_query=nameSTARTSWITHsam"},{"label":"Scheduled jobs","path":"sysauto_list.do?sysparm_query=nameSTARTSWITHSAM"}],"note":"A [[role]] is a set of permissions. A [[scheduled job]] is a task the system runs on its own; we start some of them at once with **Execute Now**.","see":"**sam_user** and **sam_admin** exist, and several jobs start with **SAM**, such as **SAM - Software License Reconciliation**.","record":[{"id":"jobs","label":"Job names found","type":"textarea"}],"shot":"S1_03_roles_and_jobs.png"},{"id":"s1-7","num":"1.8","title":"Open the Software Asset Workspace","where":"Your instance","what":"Opens the [[Software Asset Workspace]], the modern screen where most SAM work and all results are shown.","do":["Click **All** (top left) and type **Software Asset Workspace**.","Click **Software Asset Workspace** in the results. The workspace opens on the page **Software asset overview**.","Look at the menu on the left. It has views such as **License usage** and **License operations**. Click each one once.","Write in the box below whether it opened directly."],"copy":[{"label":"All menu text","value":"Software Asset Workspace"}],"see":"The Software Asset Workspace opens and shows **License usage** and **License operations** in its menu.","help":["It is not in the All menu, or it opens an empty page: this is a known sandbox problem. Do step 1.9, then come back."],"record":[{"id":"workspace_path","label":"Opened directly, or which fix worked","fact":true}],"shot":"S1_04_sam_workspace.png"},{"id":"s1-wsfix","num":"1.9","title":"Only if the workspace is missing: install it","where":"Your instance","optional":true,"what":"Fixes a known sandbox problem: SAM Professional sometimes arrives without its workspace. Skip this step when step 1.8 worked.","do":["Click **All** and type **All Available Applications**. Click **All** under it. The application manager opens.","In its search box type **Software Asset Management Guided Experiences**. Older name: **Software Asset Management Playbooks and Guided Setups**.","Click the result, click **Install** and confirm. It brings the workspace with it. Wait until it shows as installed, 10 to 30 minutes.","Not listed: search **Software Asset Workspace** instead and install it. If it already shows as installed, open it and click **Repair**.","Sign out, close the browser, sign in again and repeat step 1.8.","Still missing: copy the workspace installer script below, run it in **Scripts - Background**, wait 30 minutes and repeat step 1.8.","Still missing after two tries: work in the classic menus (All, Software Asset). Every step in this guide also names the classic way. Write the decision in tracker/decisions.md."],"copy":[{"label":"Search text","value":"Software Asset Management Guided Experiences"},{"label":"Or","value":"Software Asset Workspace"}],"script":"00_install_workspace.js","links":[{"label":"Scripts - Background","path":"sys.scripts.do"}],"see":"The Software Asset Workspace opens, or the classic-menu decision is written in tracker/decisions.md.","record":[{"id":"workspace_fix","label":"What you tried and what worked","type":"textarea"}]},{"id":"s1-8","num":"1.10","title":"Check for the Content Service","where":"Your instance","what":"Records that the paid [[Content Service]] is not part of a sandbox. Stage 3 shows how we clean software names without it.","do":["Click **Content Service setup** below.","Write what you see in the box below."],"links":[{"label":"Content Service setup","path":"sn_samp_content_service_setup_list.do"}],"see":"On a sandbox this usually shows an error or an empty page. That is expected. If it opens with settings, write that down.","record":[{"id":"content_service","label":"What you saw","fact":true}],"shot":"S1_05_content_service.png"},{"id":"s1-9","num":"1.11","title":"Take the before picture of normalization","where":"Your instance","what":"Counts how clean the sample software names are before we start. This is the starting point for the case study.","do":["Click **Discovery models** below.","Right-click the column heading **Normalization status** and choose **Group By Normalization status**.","Copy each group name and its count into the box below."],"links":[{"label":"Discovery models","path":"cmdb_sam_sw_discovery_model_list.do"}],"note":"[[Normalization]] cleans messy software names into standard ones.","see":"Groups such as Normalized, Partially Normalized, Publisher Normalized and Match Not Found, each with a count.","help":["No column **Normalization status**: right-click any column heading, choose **Configure**, **List Layout**, move **Normalization status** to the right side and click **Save**."],"record":[{"id":"baseline_norm","label":"Count per normalization status","type":"textarea","fact":true}],"shot":"S1_06_normalization_before.png"},{"id":"s1-10","num":"1.12","title":"Give each team member their own login","where":"Your instance","optional":true,"what":"Lets every team member sign in with their own user, so nobody shares the admin password.","do":["Click **Users** below, then **New**.","Fill in the form as shown in the table and click **Submit**.","Open the new user again. In the **Roles** tab at the bottom, click **Edit...**.","In the left box find **admin**, select it, click the arrow pointing right, then click **Save**.","Click **Set Password**, click **Generate**, copy the password, click **Save Password**. Give it to the person privately; they change it at first login."],"form":[{"title":"New user","rows":[{"field":"User ID","value":"first.last","note":"their own name, for example anna.devries","copy":false},{"field":"First name","value":"their first name","copy":false},{"field":"Last name","value":"their last name","copy":false},{"field":"Password needs reset","value":"ticked","copy":false}]}],"links":[{"label":"Users","path":"sys_user_list.do"}],"see":"Each team member signs in with their own user."}],"checks":[{"id":"s1-c1","text":"SAM plugins are active, and their IDs and versions are written down."},{"id":"s1-c2","text":"The installation, discovery model, software model and entitlement lists open."},{"id":"s1-c3","text":"sam_user and sam_admin exist, and the SAM job names are written down."},{"id":"s1-c4","text":"The Software Asset Workspace opens, or the classic-menu fallback is written in tracker/decisions.md."},{"id":"s1-c5","text":"The Content Service result and the before counts of normalization are recorded."}],"problems":[{"problem":"Activation keeps failing","fix":"1) Wait 30 minutes, then try again from the Developer Site. 2) In the instance open All, All Available Applications, All. Search Software Asset Management and install the basic application if it is offered, then try the Developer Site again. 3) Write the exact error text and time in step 1.1. This order fixed repeated failures for others in 2025 and 2026."},{"problem":"Workspace is missing","fix":"Do step 1.9. It covers the Guided Experiences application, Repair, the installer script and the classic-menu fallback."},{"problem":"Lists are empty after activation","fix":"The demo data did not load. That is fine: our own data arrives in Stage 2."},{"problem":"A security or access message","fix":"Make sure you are signed in as admin. For scripts: your picture (top right), Elevate role, tick security_admin, Update."}]},{"id":"s2","number":2,"title":"Create our fake company, Northstar","short":"Load Northstar","time":"45 to 60 minutes","goal":"Load [[Northstar Manufacturing]] into the sandbox: 60 employees, 45 laptops, 12 servers and 248 software installations. The five license stories are built on this data.","why":"In a real company this data comes from scanning tools on every computer. In the sandbox one script plays that tool and creates the same records a scan would. All of it is [[synthetic data]].","before":["Stage 1 is finished: SAM Professional is active and the workspace opens (or the fallback is noted)."],"steps":[{"id":"s2-1","num":"2.1","title":"Start the change log for this stage","where":"Your instance","what":"Creates an [[update set]] for this stage. It records every setting we change, so Stage 6 can export it as a backup.","do":["Click **Update sets** below. The list **Local Update Sets** opens.","Click **New** at the top of the list. An empty update set form opens.","Fill in **Name** as shown in the table.","Click **Submit and Make Current**."],"form":[{"title":"Update set form","rows":[{"field":"Name","value":"SAM Portfolio S2 Data"}]}],"links":[{"label":"Update sets","path":"sys_update_set_list.do?sysparm_query=nameSTARTSWITHSAM%20Portfolio%5EORDERBYname"}],"see":"The list shows **SAM Portfolio S2 Data** with State **In progress**, and the globe icon in the top bar shows it as your current update set.","help":["There is only a **Submit** button: click it, click the new update set in the list, then click **Make This My Current Set**.","To check the current update set at any time, click the globe icon in the top bar. No globe icon: click your picture (top right), **Preferences**, **Developer**, and switch on **Show update set picker in header**."]},{"id":"s2-2","num":"2.2","title":"Open Scripts - Background","where":"Your instance","what":"Opens the page where an admin pastes a script and runs it once. We use it to load Northstar.","do":["Click **Scripts - Background** below. Or: click **All**, type **Scripts - Background** and click it.","If a message says you need elevated rights, or there is no **Run script** button: click your picture (top right), choose **Elevate role**, tick **security_admin** and click **Update**. Then click **Scripts - Background** again."],"links":[{"label":"Scripts - Background","path":"sys.scripts.do"}],"note":"A [[background script]] runs once, as admin. Our scripts only create or update Northstar records and never delete anything.","see":"A page with a large empty text box, a list next to **in scope** that says **global**, and a **Run script** button."},{"id":"s2-3","num":"2.3","title":"Run the Northstar loader","where":"Your instance","script":"01_load_northstar.js","what":"Creates the whole fake company in one go: 2 companies, 3 sites, 6 departments, 60 people, 45 laptops, 12 servers and 248 software installations.","do":["Click **Copy script** below. The guide copies the whole script, about 49 KB.","Go to the Scripts - Background page. Click inside the big text box and paste: Ctrl+V, or Cmd+V on a Mac.","Check that **in scope** says **global**. Leave the tick boxes as they are.","Click **Run script**.","Wait 1 to 2 minutes. A white page with result lines appears.","Select all result lines, copy them and paste them into the box below."],"see":"The last line says **RESULT: OK**. The lines above it show 60 users, 45 computers, 12 servers, 248 installations and 8 discovery models.","help":["The result says CHECK or ERROR: paste the lines into the box and read the notes. Running the script again fixes most problems.","Ran it twice by mistake: no problem. The script updates records instead of creating copies.","Nothing happens for a long time: wait 5 minutes, then check the installations list in step 2.6. The records may already be there."],"record":[{"id":"loader_result","label":"Result lines from the script","type":"textarea"}],"shot":"S2_01_loader_result.png"},{"id":"s2-4","num":"2.4","title":"Check the people and computers","where":"Your instance","what":"Confirms that the people, laptops and servers exist.","do":["Click each of the three buttons below.","In each list, read the count at the bottom right."],"links":[{"label":"Northstar users","path":"sys_user_list.do?sysparm_query=company.name%3DNorthstar%20Manufacturing"},{"label":"Northstar laptops","path":"cmdb_ci_computer_list.do?sysparm_query=nameSTARTSWITHNSM-WS"},{"label":"Northstar servers","path":"cmdb_ci_server_list.do?sysparm_query=nameSTARTSWITHNSM-%5EORDERBYname"}],"see":"60 users, 45 laptops and 12 servers.","shot":"S2_02_people_and_computers.png"},{"id":"s2-5","num":"2.5","title":"Check the server processor numbers","where":"Your instance","what":"Checks the two numbers that decide how many core licenses Microsoft wants: processors per server and cores per processor.","do":["Click **Northstar servers** below.","Click **NSM-SQL-01** in the Name column. The server form opens.","Find the fields **CPU count** and **CPU core count**. Scroll down if you do not see them.","Click the back arrow and open **NSM-WIN-01** the same way."],"links":[{"label":"Northstar servers","path":"cmdb_ci_server_list.do?sysparm_query=nameSTARTSWITHNSM-%5EORDERBYname"}],"note":"CPU count is the number of processors. CPU core count is the number of cores in each processor. [[Per core licensing]] in Stage 4 multiplies the two.","see":"NSM-SQL-01: **CPU count 2**, **CPU core count 4**, so 8 cores. NSM-WIN-01: 2 and 8, so 16 cores."},{"id":"s2-6","num":"2.6","title":"Check the software installations","where":"Your instance","what":"Confirms the 248 [[installation|installations]] exist and that each one was linked to a [[discovery model]].","do":["Click **Northstar installations** below and read the count at the bottom right.","Click any **Adobe Acrobat (64-bit)** row. The installation form opens.","Look at the field **Discovery model**. It must be filled in."],"links":[{"label":"Northstar installations","path":"cmdb_sam_sw_install_list.do?sysparm_query=installed_on.nameSTARTSWITHNSM-"}],"note":"Each row is one installation: one program on one computer.","see":"248 installations, and the Discovery model field is filled in.","help":["Discovery model is empty: wait one minute and reload. Still empty: click **All**, type **sys_script.list** and press Enter, search the business rule **Create a Software Normalization** and check that it is active."],"shot":"S2_03_installations.png"},{"id":"s2-7","num":"2.7","title":"Group the installations by discovery model","where":"Your instance","what":"Shows that 248 installations boil down to 8 different programs.","do":["Stay in the installations list from the previous step.","Right-click the column heading **Discovery model** and choose **Group By Discovery model**.","Count the groups."],"links":[{"label":"Northstar installations","path":"cmdb_sam_sw_install_list.do?sysparm_query=installed_on.nameSTARTSWITHNSM-"}],"note":"Each group is one discovery model: one record per unique publisher, name and version found on computers.","see":"8 groups: 5 licensed products (Acrobat, SQL Server, Visio, Project, Windows Server) and 3 free tools (Chrome, 7-Zip, Notepad++).","help":["No column **Discovery model**: right-click a column heading, choose **Configure**, **List Layout**, move **Discovery model** to the right side and click **Save**."],"shot":"S2_04_installations_by_discovery_model.png"},{"id":"s2-8","num":"2.8","title":"Run the name cleaning once","where":"Your instance","what":"Starts ServiceNow's automatic name cleaning now instead of waiting for tonight's run. Stage 3 starts from its result.","do":["Click **Normalization jobs** below. A list of scheduled jobs opens.","Click **SAM - Normalize discovery models using content library rules**.","Click **Execute Now** at the top right of the form.","Wait 5 minutes. The job runs in the background; nothing changes on screen.","Copy the job name into the box below."],"links":[{"label":"Normalization jobs","path":"sysauto_list.do?sysparm_query=nameLIKEnormaliz"}],"see":"A short message that the job was scheduled, or you are back in the list.","help":["The exact name differs: pick the job that mentions discovery models and content library."],"record":[{"id":"norm_job","label":"Name of the job you ran"}]},{"id":"s2-9","num":"2.9","title":"Learn the manual import way","where":"Your instance","optional":true,"what":"Practises how real projects load spreadsheets, with an [[import set|Import Set]]. Our users already exist, so this only updates them.","do":["Open **Northstar files** in this guide and download **04_users.csv**.","In the instance click **All**, type **Load Data** and click it.","Choose **Create table**, type the label **NSM Users test**, choose the file **04_users.csv** and click **Submit**.","When the load finishes, click **Create transform map**.","Set **Target table** to **User [sys_user]**, right-click the header and choose **Save**.","Under Related Links click **Auto Map Matching Fields**.","In the **Field Maps** list, open the row for **user_name**, tick **Coalesce** and click **Update**.","Under Related Links click **Transform**, then **Transform** again."],"links":[{"label":"Open Northstar files","view":"files"}],"see":"The transform history shows 60 rows updated and none inserted. Coalesce made it update the existing users instead of creating copies."}],"checks":[{"id":"s2-c1","text":"The loader result says RESULT: OK."},{"id":"s2-c2","text":"60 users, 45 laptops and 12 servers exist."},{"id":"s2-c3","text":"NSM-SQL-01 shows CPU count 2 and CPU core count 4."},{"id":"s2-c4","text":"248 installations, all with a discovery model, in 8 groups."},{"id":"s2-c5","text":"The normalization job ran once."}],"problems":[{"problem":"The Copy script button does nothing","fix":"The guide then opens a box with the script selected: press Ctrl+C (Cmd+C on a Mac). Or download the file on the Scripts page and copy it from there."},{"problem":"A security message on the script page","fix":"Elevate to security_admin (step 2.2) and run the script again."},{"problem":"Counts lower than expected","fix":"Run the loader again. If the notes mention a missing field, copy them into step 2.3 and carry on. Users, computers and installations are the counts that matter."}]},{"id":"s3","number":3,"title":"Clean the software names and define our products","short":"Clean names, define products","time":"1.5 to 2 hours","goal":"Give each of the 8 Northstar discovery models a clean, standard name, then create the 5 software models we manage licenses for.","why":"License counting only works when \"Adobe Acrobat (64-bit) 24.2.20857\" is recognised as Adobe Acrobat Pro. Paid instances get help from the online Content Service. In the sandbox we use the built-in [[content library]] and finish by hand, which proves we understand how [[normalization]] works.","before":["Stage 2 is finished: 248 Northstar installations with discovery models."],"steps":[{"id":"s3-1","num":"3.1","title":"Start the change log for this stage","where":"Your instance","what":"Creates an [[update set]] for this stage. It records every setting we change, so Stage 6 can export it as a backup.","do":["Click **Update sets** below. The list **Local Update Sets** opens.","Click **New** at the top of the list. An empty update set form opens.","Fill in **Name** as shown in the table.","Click **Submit and Make Current**."],"form":[{"title":"Update set form","rows":[{"field":"Name","value":"SAM Portfolio S3 Normalization"}]}],"links":[{"label":"Update sets","path":"sys_update_set_list.do?sysparm_query=nameSTARTSWITHSAM%20Portfolio%5EORDERBYname"}],"see":"The list shows **SAM Portfolio S3 Normalization** with State **In progress**, and the globe icon in the top bar shows it as your current update set.","help":["There is only a **Submit** button: click it, click the new update set in the list, then click **Make This My Current Set**.","To check the current update set at any time, click the globe icon in the top bar. No globe icon: click your picture (top right), **Preferences**, **Developer**, and switch on **Show update set picker in header**."]},{"id":"s3-2","num":"3.2","title":"Read the status of our 8 discovery models","where":"Your instance","script":"04_show_normalization.js","what":"Shows how clean the 8 Northstar software names are before we touch them. A read-only script lists all 8 at once, so nobody has to open 8 records.","do":["Click **Scripts - Background** below.","Click **Copy script**, paste it into the big text box and click **Run script**. It only reads; it changes nothing.","The result lists 8 discovery models, each with a **Status** line. Choose that status for each row in the table below.","Copy all result lines into the box below. You need the clean values in the next steps."],"links":[{"label":"Scripts - Background","path":"sys.scripts.do"}],"grid":{"id":"norm_before","rowLabel":"Discovery model (as found)","summary":true,"rate":{"column":"before","good":["Normalized","Manually Normalized"],"label":"Clean before"},"columns":[{"key":"before","label":"Status before","type":"select","options":["Normalized","Manually Normalized","Partially Normalized","Publisher Normalized","Match Not Found","New"]}],"rows":[{"id":"acrobat","label":"Adobe Acrobat (64-bit)"},{"id":"sql","label":"Microsoft SQL Server 2022 Standard Edition"},{"id":"visio","label":"Microsoft Visio Professional 2021"},{"id":"project","label":"Microsoft Project Professional 2021"},{"id":"winsrv","label":"Microsoft Windows Server 2022 Standard"},{"id":"chrome","label":"Google Chrome"},{"id":"zip","label":"7-Zip 24.08 (x64)"},{"id":"npp","label":"Notepad++ (64-bit x64)"}]},"note":"The [[normalization status]] tells how well a name was cleaned. **Normalized** and **Manually Normalized** count as clean.","see":"8 numbered entries with a status each, and a last line such as **Clean (Normalized or Manually normalized): 3 of 8**.","help":["Fewer than 8 entries: the loader did not finish. Run step 2.3 again.","Status shows **(empty)** for all: the name cleaning job has not run yet. Do step 2.8, wait 5 minutes and run this script again."],"record":[{"id":"norm_status_before","label":"Result lines of the status script","type":"textarea"}],"shot":"S3_01_normalization_before.png"},{"id":"s3-3","num":"3.3","title":"Accept the suggestions that fit","where":"Software Asset Workspace","optional":true,"what":"Lets ServiceNow's own suggestions clean a name for you, where it has one.","do":["Open the **Software Asset Workspace** (All, Software Asset Workspace).","Click **License operations** in the menu on the left, then **Normalization suggestions**.","Look for suggestions for our 8 products. Accept one only when its publisher and product match the table in step 3.4."],"see":"Accepted suggestions change the status of that discovery model. Often there are none on a sandbox. That is fine."},{"id":"s3-4","num":"3.4","title":"Clean the remaining names by hand","where":"Your instance","what":"Gives each Northstar product a clean publisher, product, version, edition and product type, so the license check recognises it. We do it by hand because a sandbox has no paid Content Service.","do":["Work through the 8 products below one at a time. Products already **Normalized** or **Manually Normalized** in step 3.2: choose **Already clean** and skip them.","Click the product's **Installations** button. The list of its installations opens.","Click the first installation in the list (the blue text). The installation form opens.","Next to the field **Discovery model**, click the small **(i)** button, then **Open Record**. The discovery model form opens.","Fill in **Publisher**, **Product**, **Version** and **Edition** with the values shown for the product below. In Publisher and Product, type the first letters and pick from the list that appears.","Set **Product type** to the value shown below.","Right-click the grey header bar of the form and choose **Save**. **Normalization status** changes to **Manually Normalized**.","Choose **Cleaned by hand** for the product and go on to the next one."],"grid":{"id":"norm_manual","layout":"cards","rowLabel":"Discovery model (as found)","summary":true,"columns":[{"key":"open","label":"Open","type":"link","linkLabel":"Installations"},{"key":"publisher","label":"Publisher","fixed":true,"copy":true},{"key":"product","label":"Product","fixed":true,"copy":true},{"key":"version","label":"Version","fixed":true,"copy":true},{"key":"edition","label":"Edition","fixed":true,"copy":true},{"key":"type","label":"Product type","fixed":true},{"key":"result","label":"Result","type":"select","options":["Already clean","Cleaned by hand","Could not clean"]}],"rows":[{"id":"acrobat","label":"Adobe Acrobat (64-bit)","open":"cmdb_sam_sw_install_list.do?sysparm_query=installed_on.nameSTARTSWITHNSM-%5Edisplay_name%3DAdobe%20Acrobat%20%2864-bit%29","publisher":"Adobe","product":"Acrobat","version":"2024","edition":"Pro","type":"Licensable"},{"id":"sql","label":"Microsoft SQL Server 2022 Standard Edition","open":"cmdb_sam_sw_install_list.do?sysparm_query=installed_on.nameSTARTSWITHNSM-%5Edisplay_name%3DMicrosoft%20SQL%20Server%202022%20Standard%20Edition","publisher":"Microsoft","product":"SQL Server","version":"2022","edition":"Standard","type":"Licensable"},{"id":"visio","label":"Microsoft Visio Professional 2021","open":"cmdb_sam_sw_install_list.do?sysparm_query=installed_on.nameSTARTSWITHNSM-%5Edisplay_name%3DMicrosoft%20Visio%20Professional%202021","publisher":"Microsoft","product":"Visio","version":"2021","edition":"Professional","type":"Licensable"},{"id":"project","label":"Microsoft Project Professional 2021","open":"cmdb_sam_sw_install_list.do?sysparm_query=installed_on.nameSTARTSWITHNSM-%5Edisplay_name%3DMicrosoft%20Project%20Professional%202021","publisher":"Microsoft","product":"Project","version":"2021","edition":"Professional","type":"Licensable"},{"id":"winsrv","label":"Microsoft Windows Server 2022 Standard","open":"cmdb_sam_sw_install_list.do?sysparm_query=installed_on.nameSTARTSWITHNSM-%5Edisplay_name%3DMicrosoft%20Windows%20Server%202022%20Standard","publisher":"Microsoft","product":"Windows Server","version":"2022","edition":"Standard","type":"Licensable"},{"id":"chrome","label":"Google Chrome","open":"cmdb_sam_sw_install_list.do?sysparm_query=installed_on.nameSTARTSWITHNSM-%5Edisplay_name%3DGoogle%20Chrome","publisher":"Google","product":"Chrome","version":"130","edition":"leave empty","type":"Not Licensable"},{"id":"zip","label":"7-Zip 24.08 (x64)","open":"cmdb_sam_sw_install_list.do?sysparm_query=installed_on.nameSTARTSWITHNSM-%5Edisplay_name%3D7-Zip%2024.08%20%28x64%29","publisher":"Igor Pavlov","product":"7-Zip","version":"24.08","edition":"leave empty","type":"Not Licensable"},{"id":"npp","label":"Notepad++ (64-bit x64)","open":"cmdb_sam_sw_install_list.do?sysparm_query=installed_on.nameSTARTSWITHNSM-%5Edisplay_name%3DNotepad%2B%2B%20%2864-bit%20x64%29","publisher":"Notepad++ Team","product":"Notepad++","version":"8.7","edition":"leave empty","type":"Not Licensable"}]},"note":"A manually normalized model keeps your values; the automatic job no longer changes it. Only **Licensable** software is counted in the license check, so the 5 licensed products must say Licensable.","see":"Every product is **Already clean** or **Cleaned by hand**.","help":["**Publisher** is grey and cannot be changed: it is already clean. Leave it and fill in the other fields.","The product is not in the list: type fewer letters. Still missing: click the magnifier icon next to **Product**, click **New** in the window that opens, type the product name, pick the publisher and click **Submit**. Then pick it.","Acrobat is offered with other names (for example Acrobat Pro or Acrobat DC): pick the closest and write down what you chose. Use the same choice in step 3.6.","No **Save** in the right-click menu: click **Update** instead. It saves and goes back."],"shot":"S3_02_manual_normalization.png"},{"id":"s3-5","num":"3.5","title":"Check the status after cleaning","where":"Your instance","script":"04_show_normalization.js","what":"Proves that all 8 names are now clean, and shows the exact clean values the software models must use.","do":["Click **Scripts - Background** below, paste the same status script again and click **Run script**.","Choose the new status for each row in the table.","Copy all result lines into the box below."],"links":[{"label":"Scripts - Background","path":"sys.scripts.do"}],"grid":{"id":"norm_after","rowLabel":"Discovery model (as found)","summary":true,"rate":{"column":"after","good":["Normalized","Manually Normalized"],"label":"Clean after"},"columns":[{"key":"after","label":"Status after","type":"select","options":["Normalized","Manually Normalized","Partially Normalized","Publisher Normalized","Match Not Found","New"]}],"rows":[{"id":"acrobat","label":"Adobe Acrobat (64-bit)"},{"id":"sql","label":"Microsoft SQL Server 2022 Standard Edition"},{"id":"visio","label":"Microsoft Visio Professional 2021"},{"id":"project","label":"Microsoft Project Professional 2021"},{"id":"winsrv","label":"Microsoft Windows Server 2022 Standard"},{"id":"chrome","label":"Google Chrome"},{"id":"zip","label":"7-Zip 24.08 (x64)"},{"id":"npp","label":"Notepad++ (64-bit x64)"}]},"see":"The last line says **Clean (Normalized or Manually normalized): 8 of 8**.","help":["A row is still not clean: open it again as in step 3.4 and check that you saved."],"record":[{"id":"norm_status_after","label":"Result lines of the status sc

name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    name: Hygiene, data and export checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repository hygiene checks
        run: bash scripts/check_repo.sh

      - name: Validate project state JSON
        run: python3 -c "import json; json.load(open('docs/project_state.json')); print('docs/project_state.json is valid JSON')"

      - name: Synthetic data matches the generator
        run: |
          python3 scripts/generate_synthetic_data.py --out "$RUNNER_TEMP/northstar"
          diff -r "$RUNNER_TEMP/northstar" docs/synthetic_data/northstar

      - name: Verify export bundles
        run: bash scripts/verify_exports.sh

      - name: Secret scan of full history with gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
